# عند كل دمج في main: الاختبارات، ثم:
#  1) رفع الكود لـ Apps Script عبر clasp — الخطة البديلة (اختياري: يعمل فقط إذا أُضيفت الأسرار CLASPRC_JSON و SCRIPT_ID و DEPLOYMENT_ID)
#  2) دمج main في فرع production-postgresql — الخطة الأساسية: Render ينشره تلقائياً
# الواجهة على GitHub Pages ينشرها GitHub تلقائياً من الفرع (Index.html يحمّل JavaScript.html) — لا نشر ثانٍ هنا.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  apps-script:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLASPRC_JSON != '' && env.SCRIPT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLASPRC_JSON != '' && env.SCRIPT_ID != ''
        with:
          node-version: 20
      - name: Push code and update the web app deployment
        if: env.CLASPRC_JSON != '' && env.SCRIPT_ID != ''
        run: |
          npm install -g @google/clasp@2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp push --force
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "auto ${GITHUB_SHA::7}"
          else
            clasp version "auto ${GITHUB_SHA::7}"
          fi
      - name: Skipped (no Apps Script secrets)
        if: env.CLASPRC_JSON == '' || env.SCRIPT_ID == ''
        run: echo "Apps Script secrets are not set — only GitHub Pages was updated."

  # الخطة الأساسية (Render + Supabase): نفس التحديثات تصل فرع production-postgresql تلقائياً
  trial-branch:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main into production-postgresql
        run: |
          if ! git ls-remote --exit-code --heads origin production-postgresql >/dev/null; then echo "no production-postgresql branch"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B production-postgresql origin/production-postgresql
          if git merge-base --is-ancestor origin/main HEAD; then echo "already up to date"; exit 0; fi
          # تعارض = يتوقف هنا (الفرع لا يتغير) ويظهر الفشل في Actions لحلّه يدوياً
          git merge --no-edit origin/main -m "Merge main into production-postgresql (auto)"
          git push origin production-postgresql
