function fmtDateTime(v) { const d = toDate(v); return d ? d.toLocaleString(locale(), { timeZone: 'Asia/Riyadh', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; }

  return p.find(x => x.type === 'year').value + '-' + p.find(x => x.type === 'month').value;

   Backend transport
   ===================================================================== */
/* عبر google.script.run (داخل Apps Script) كل استدعاء مباشر.
   عبر fetch (GitHub Pages): عمليات القراءة التي تصدر في نفس اللحظة تُجمَّع في طلب واحد (batch)،
   بحد أقصى طلبين متزامنين، مع إعادة محاولة تلقائية للقراءة فقط عند فشل الشبكة. */
const NET = { queue: [], inflight: 0, max: 2, flushTimer: null };
const RETRYABLE = ['ERR_NETWORK', 'ERR_BAD_RESPONSE'];
function isRead(fn) { return /^get/.test(fn); }

function postJson(body) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // نص عادي لتفادي طلب CORS المسبق
    body: JSON.stringify(body)
  }).then(r => {
    if (!r.ok) throw new Error('ERR_NETWORK');
    return r.text();
  }).then(txt => {
    try { return JSON.parse(txt); } catch (e) { throw new Error('ERR_BAD_RESPONSE'); }
  }, e => { throw (e && /^ERR_/.test(e.message)) ? e : new Error('ERR_NETWORK'); });
}
function withRetry(fn, tries) {
  return fn().catch(e => {
    if (tries > 0 && RETRYABLE.indexOf(errCode(e)) !== -1) {
      return new Promise(r => setTimeout(r, (3 - tries) * 700 + 400)).then(() => withRetry(fn, tries - 1));
    }
    throw e;
  });
}
function pumpQueue() {
  while (NET.inflight < NET.max && NET.queue.length) {
    // اجمع كل القراءات المتتالية في رأس الطابور في دفعة واحدة
    let group = [NET.queue.shift()];
    if (isRead(group[0].fn)) {
      while (NET.queue.length && isRead(NET.queue[0].fn) && group.length < 12) group.push(NET.queue.shift());
    }
    NET.inflight++;
    sendGroup(group).finally(() => { NET.inflight--; pumpQueue(); });
  }
}
function sendGroup(group) {
  const token = S.token;
  if (group.length === 1) {
    const c = group[0];
    const once = () => postJson({ token: token, fn: c.fn, args: c.args }).then(res => {
      if (res.ok) return res.data;
      throw new Error(res.error || 'ERR_NETWORK');
    });
    return (isRead(c.fn) ? withRetry(once, 2) : once()).then(c.resolve, c.reject);
  }
  const once = () => postJson({ token: token, fn: 'batch', args: [group.map(c => [c.fn, c.args])] }).then(res => {
    if (!res.ok) throw new Error(res.error || 'ERR_NETWORK');
    return res.data;
  });
  return withRetry(once, 2).then(results => {
    group.forEach((c, i) => {
      const r = results[i];
      if (r && r.ok) c.resolve(r.data); else c.reject(new Error((r && r.error) || 'ERR_NETWORK'));
    });
  }, e => { group.forEach(c => c.reject(e)); });
}

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(S.token, fn, args);
      return;
    }
    NET.queue.push({ fn: fn, args: args, resolve: resolve, reject: reject });
    clearTimeout(NET.flushTimer);
    NET.flushTimer = setTimeout(pumpQueue, 15); // لحظة قصيرة لتجميع الطلبات المتزامنة
  }).catch(e => {
    if (errCode(e) === 'ERR_SESSION' && fn !== 'login' && S.user) sessionExpired();
    throw e;
  });
}

function toast(msg, type, ms) {

  ms = ms || (type === 'error' ? 5000 : 3000);
  const ic = { success: 'check', error: 'x', info: 'info', warning: 'alert' }[type] || 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = '<span class="t-ic">' + icon(ic) + '</span><span class="grow">' + esc(msg) + '</span><span class="t-bar" style="animation-duration:' + ms + 'ms"></span>';
  const root = $('#toasts');
  root.appendChild(el);
  while (root.children.length > 4) root.firstChild.remove();
  const kill = () => { el.classList.add('leaving'); setTimeout(() => el.remove(), 260); };
  const h = setTimeout(kill, ms);
  el.addEventListener('click', () => { clearTimeout(h); kill(); });
}

/* =====================================================================
   Modals (stack, focus trap, Esc, animated close)
   ===================================================================== */
const MODALS = [];
function openModal(opts) {
  const layer = document.createElement('div');
  layer.className = 'modal-layer';
  layer.innerHTML =
    '<div class="scrim" data-close></div>' +
    '<div class="modal ' + (opts.size || '') + '" role="dialog" aria-modal="true" aria-labelledby="mt' + MODALS.length + '">' +
      '<div class="modal-head">' + (opts.icon ? '<span class="m-ic ' + (opts.tone || '') + '">' + icon(opts.icon) + '</span>' : '') +
        '<div class="grow"><h2 id="mt' + MODALS.length + '">' + opts.title + '</h2>' + (opts.sub ? '<p>' + opts.sub + '</p>' : '') + '</div>' +
        '<button class="btn btn-ghost btn-icon btn-sm" data-close aria-label="' + esc(t('close')) + '">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') +
    '</div>';
  const m = { el: layer, opts: opts, prevFocus: document.activeElement };
  layer._modal = m;
  layer.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(m); });
  $('#modals').appendChild(layer);
  MODALS.push(m);
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    const f = layer.querySelector('[autofocus]') || layer.querySelector('.modal-body input:not([type=hidden]):not([disabled]), .modal-body textarea, .modal-body select');
    const md = layer.querySelector('.modal');
    if (f && !('ontouchstart' in window)) f.focus(); else { md.setAttribute('tabindex', '-1'); md.focus({ preventScroll: true }); }
  }, 60);
  if (opts.onOpen) opts.onOpen(layer, m);
  return m;
}
function closeModal(m) {
  if (!m || m.closing) return;
  if (m.opts.onClose && m.opts.onClose() === false) return;
  m.closing = true;
  m.el.classList.add('closing');
  const i = MODALS.indexOf(m);
  if (i !== -1) MODALS.splice(i, 1);
  setTimeout(() => {
    m.el.remove();
    if (!MODALS.length) document.body.style.overflow = '';
    if (m.prevFocus && m.prevFocus.focus && document.contains(m.prevFocus)) m.prevFocus.focus();
  }, REDUCED ? 0 : 200);
}
function topModal() { return MODALS[MODALS.length - 1]; }
document.addEventListener('keydown', e => {
  const m = topModal();
  if (!m) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(m); }
  if (e.key === 'Tab') {
    const f = $$('button:not([disabled]), [href], input:not([disabled]):not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])', m.el)
      .filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
function confirmDialog(msg, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    let answered = false;
    const m = openModal({
      title: esc(opts.title || t('confirm')), icon: opts.icon || 'alert', tone: opts.danger ? 'danger' : 'warn', size: 'sm',
      body: '<p>' + esc(msg) + '</p>',
      foot: '<span class="spacer"></span><button class="btn" data-close>' + esc(t('cancel')) + '</button>' +
            '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-yes autofocus>' + esc(opts.ok || t('confirm')) + '</button>',
      onClose: () => { if (!answered) resolve(false); }
    });
    m.el.querySelector('[data-yes]').addEventListener('click', () => { answered = true; resolve(true); closeModal(m); });
  });
}
function busy(btn, on, label) {
  if (!btn) return;
  if (on) {
    btn._html = btn.innerHTML; btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>' + (label ? '<span>' + esc(label) + '</span>' : '');
  } else if (btn._html !== undefined) {
    btn.disabled = false; btn.innerHTML = btn._html; delete btn._html;
  }
}

const NAV = {

  procurement: [{ id: 'requests', icon: 'package', k: 'nav_requests' }, { id: 'complaints', icon: 'alert', k: 'nav_complaints' }],
  doctor:      [{ id: 'reviews', icon: 'steth', k: 'nav_reviews' }],

  admin:       [{ id: 'overview', icon: 'chart', k: 'nav_overview' }, { id: 'complaints', icon: 'alert', k: 'nav_complaints' }, { id: 'notices', icon: 'mega', k: 'nav_notices' }, { id: 'users', icon: 'users', k: 'nav_users' }]

function applyConfig(cfg) {
  if (!cfg) return;

function enterApp(cfg) {

  S.lastSync = new Date(); updateSyncTime();

  if (['procurement', 'dashboard', 'admin'].indexOf(S.user.screen) !== -1 && S.view !== 'complaints') loadComplaints(true);

function navCount(id) {

function stepperHtml(r) {
  const cur = stMeta(r.status).step;
  const rejected = r.status === ST.REJECTED;
  const steps = [
    { k: 'step_submitted', ic: 'clipboard', at: r.submittedAt },
    { k: 'step_prep', ic: 'package', at: r.prepAt },
    { k: 'step_review', ic: 'steth', at: r.reviewAt },
    { k: 'step_approved', ic: rejected ? 'x' : 'check', at: r.reviewedAt },
    { k: 'step_sent', ic: 'truck', at: r.sentAt },
    { k: 'step_received', ic: 'pen', at: r.receivedAt }
  ];
  return '<div class="stepper">' + steps.map((s, i) => {
    let cls = 'todo';
    if (rejected && i === 3) cls = 'failed';
    else if (i < cur || (i === cur && (r.status === ST.RECEIVED))) cls = 'done';
    else if (i === cur) cls = 'current';
    if (s.at && cls === 'todo') cls = 'done';
    const lbl = rejected && i === 3 ? t('st_rejected') : t(s.k);
    return '<div class="step ' + cls + '"><span class="node">' + icon(cls === 'done' ? 'check' : s.ic) + '</span><span class="s-lbl">' + esc(lbl) + '</span><span class="s-time">' + (s.at ? esc(fmtDateTime(s.at)) : '&nbsp;') + '</span></div>';
  }).join('') + '</div>';
}

  const d = nurseDraft();
  const ex = d.items.find(i => i.name.toLowerCase() === name.toLowerCase());
  if (ex) { ex.qty = Math.min(100000, ex.qty + (qty || 1)); ex._bump = true; }
  else { const c = catalogInfo(name); d.items.push({ name: c ? c.name : name, qty: qty || 1, _new: true }); }

function setupCombo() {
  const inp = $('#itemSearch'), list = $('#comboList');
  let opts = [], active = -1;
  const close = () => { list.classList.add('hidden'); inp.setAttribute('aria-expanded', 'false'); active = -1; };
  const hl = (name, q) => {
    if (!q) return esc(name);
    const i = name.toLowerCase().indexOf(q.toLowerCase());
    return i === -1 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
  };
  const render = () => {
    const q = inp.value.trim();
    const ql = q.toLowerCase();
    const matches = S.catalog.filter(c => !ql || c.name.toLowerCase().indexOf(ql) !== -1 || (c.commercial || '').toLowerCase().indexOf(ql) !== -1 || (c.category || '').toLowerCase().indexOf(ql) !== -1)
      .sort((a, b) => (a.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1) - (b.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1) || a.name.localeCompare(b.name))
      .slice(0, 30);
    const exact = S.catalog.some(c => c.name.toLowerCase() === ql);
    opts = matches.map(c => ({ name: c.name, c: c }));
    if (q && !exact) opts.push({ name: q, isNew: true });
    active = opts.length ? 0 : -1;
    if (!opts.length) {
      list.innerHTML = '<div class="combo-empty">' + esc(S.catalog.length ? t('no_items_match') : t('catalog_empty')) + '</div>';
    } else {
      list.innerHTML = opts.map((o, i) => o.isNew
        ? '<div class="combo-opt new" role="option" data-i="' + i + '" aria-selected="' + (i === active) + '"><span class="ic">' + icon('plus') + '</span><div><div class="nm">' + esc(t('add_new_item', { q: o.name })) + '</div><div class="mt">' + esc(t('new_item_hint')) + '</div></div></div>'
        : '<div class="combo-opt" role="option" data-i="' + i + '" aria-selected="' + (i === active) + '"><span class="ic">' + icon('package') + '</span><div class="grow"><div class="nm">' + hl(o.name, q) + '</div>' +
          ((o.c.commercial || o.c.category || o.c.price) ? '<div class="mt">' + esc([o.c.commercial, o.c.category].filter(Boolean).join(' · ')) + (o.c.price ? ' · ' + fmtNum(o.c.price, 2) + ' ' + esc(t('currency')) : '') + '</div>' : '') + '</div></div>').join('');
    }
    list.classList.remove('hidden');
    inp.setAttribute('aria-expanded', 'true');
  };
  const setActive = i => {
    active = i;
    $$('.combo-opt', list).forEach((el, j) => { el.setAttribute('aria-selected', String(j === i)); if (j === i) el.scrollIntoView({ block: 'nearest' }); });
  };
  const pick = i => {
    const o = opts[i]; if (!o) return;
    addItem(o.name, 1);
    inp.value = '';
    render();
    inp.focus();
  };
  inp.addEventListener('input', render);
  inp.addEventListener('focus', render);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.classList.contains('hidden')) render(); else setActive(Math.min(active + 1, opts.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); if (active >= 0) pick(active); }
    else if (e.key === 'Escape') { if (!list.classList.contains('hidden')) { e.stopPropagation(); close(); } }
  });
  list.addEventListener('mousedown', e => { const o = e.target.closest('.combo-opt'); if (o) { e.preventDefault(); pick(Number(o.dataset.i)); } });
  inp.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== inp) close(); }, 120));
}

  if (l && !e.target.closest('#combo')) { l.classList.add('hidden'); $('#itemSearch').setAttribute('aria-expanded', 'false'); }
});

function signaturePad(canvas, wrap) {
  let ctx, drawing = false, ink = false, last = null;
  const setup = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14201c'; ctx.lineWidth = 2.4;
    ink = false; wrap.classList.remove('inked');
  };
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(last.x, last.y); e.preventDefault(); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    const mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
    ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(mid.x, mid.y);
    last = p;
    if (!ink) { ink = true; wrap.classList.add('inked'); }
    e.preventDefault();
  });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);
  requestAnimationFrame(setup);
  return { clear: setup, hasInk: () => ink, toDataURL: () => canvas.toDataURL('image/png'), canvas: canvas };
}
function receiptImage(id, items, rec, receiver, sig) {
  try {
    const rowH = 30, W = 680;
    const H = 150 + items.length * rowH + 150;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#0f7a5f'; x.fillRect(0, 0, W, 10);
    x.textAlign = 'center'; x.fillStyle = '#0f7a5f'; x.font = 'bold 21px Arial, sans-serif';
    x.fillText('SupplyFlow — ApexCare · Receipt', W / 2, 44);
    x.fillStyle = '#555'; x.font = '13px Arial, sans-serif';
    x.fillText(id + '   |   ' + new Date().toLocaleString('en-GB', { timeZone: 'Asia/Riyadh' }), W / 2, 68);
    let y = 92;
    x.fillStyle = '#e8f4f0'; x.fillRect(20, y, W - 40, rowH);
    x.fillStyle = '#0f7a5f'; x.font = 'bold 13px Arial, sans-serif';
    x.textAlign = 'left'; x.fillText('Item', 30, y + 20);
    x.textAlign = 'center'; x.fillText('Sent', W - 170, y + 20); x.fillText('Received', W - 70, y + 20);
    y += rowH;
    items.forEach((it, i) => {
      x.fillStyle = i % 2 ? '#fff' : '#fafafa'; x.fillRect(20, y, W - 40, rowH);
      x.strokeStyle = '#e5e9e7'; x.strokeRect(20, y, W - 40, rowH);
      const sent = it.approvedQty !== '' && it.approvedQty !== null ? it.approvedQty : it.requestedQty;
      const got = rec[i] ? rec[i].qty : '';
      x.fillStyle = '#222'; x.font = '13px Arial, sans-serif';
      x.textAlign = 'left'; x.direction = /[؀-ۿ]/.test(it.item) ? 'rtl' : 'ltr';
      if (x.direction === 'rtl') { x.textAlign = 'right'; x.fillText(String(it.item), W - 230, y + 20, 400); } else x.fillText(String(it.item), 30, y + 20, 440);
      x.direction = 'ltr'; x.textAlign = 'center';
      x.fillText(String(sent), W - 170, y + 20);
      x.fillStyle = Number(got) < Number(sent) ? '#c93a3a' : '#222';
      x.fillText(String(got), W - 70, y + 20);
      y += rowH;
    });
    y += 24;
    x.fillStyle = '#333'; x.font = 'bold 13px Arial, sans-serif'; x.textAlign = 'left';
    x.fillText('Receiver: ', 30, y);
    x.font = '13px Arial, sans-serif'; x.fillText(receiver, 100, y);
    y += 14;
    x.strokeStyle = '#d8dfdb'; x.strokeRect(30, y, 240, 90);
    if (sig && sig.hasInk()) x.drawImage(sig.canvas, 30, y, 240, 90);
    x.fillStyle = '#888'; x.font = '11px Arial, sans-serif'; x.fillText(sig && sig.hasInk() ? 'Signature' : 'No signature', 30, y + 106);
    x.fillStyle = '#0f7a5f'; x.fillRect(0, H - 8, W, 8);
    return c.toDataURL('image/png');
  } catch (e) { console.error(e); return ''; }
}

function countUp(root, instant) {
  $$('[data-count]', root).forEach(el => {
    const to = Number(el.dataset.count) || 0;
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix ? '<small>' + esc(el.dataset.suffix) + '</small>' : '';
    if (REDUCED || instant || to === 0) { el.innerHTML = fmtNum(to, dec) + suffix; return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.max(0, Math.min(1, (now - t0) / dur));
      const e = 1 - Math.pow(1 - p, 3);
      el.innerHTML = fmtNum(to * e, dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

  const W = box.clientWidth, H = box.clientHeight;
  if (!W) return;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  const rtl = document.documentElement.dir === 'rtl';
  const colors = { grid: cssVar('--border'), text: cssVar('--muted'), main: cssVar('--primary'), line: cssVar('--t-blue'), surface: cssVar('--surface') };
  const data = cfg.data, labels = cfg.labels;
  const pad = { t: 22, r: 16, b: cfg.type === 'bar' ? 44 : 28, l: 40 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const L = rtl ? pad.r : pad.l, R = rtl ? W - pad.l : W - pad.r;
  const rawMax = Math.max.apply(null, data.concat([1]));
  const niceMax = (function (v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })(rawMax);
  const X = i => {
    const off = cfg.type === 'bar' ? (i + 0.5) * pw / data.length : (data.length > 1 ? i * pw / (data.length - 1) : pw / 2);
    return rtl ? R - off : L + off;
  };
  const Y = v => pad.t + ph - (v / niceMax) * ph;
  const font = s => s + 'px ' + cssVar('--font').split(',')[0];
  const points = data.map((v, i) => ({ x: X(i), y: Y(v), v: v, i: i }));
  cfg._points = points; cfg._barW = Math.min(pw / Math.max(data.length, 1) * 0.56, 46);

  function frame(p) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1; ctx.strokeStyle = colors.grid; ctx.fillStyle = colors.text; ctx.font = font(11);
    ctx.textAlign = rtl ? 'left' : 'right'; ctx.textBaseline = 'middle';
    for (let g = 0; g <= 4; g++) {
      const v = niceMax * g / 4, y = Y(v);
      ctx.beginPath(); ctx.setLineDash(g ? [3, 4] : []); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
      ctx.fillText(fmtNum(v, 0), rtl ? R + 8 : L - 8, y);
    }
    ctx.setLineDash([]);
    if (!data.length || data.every(v => !v)) {
      ctx.textAlign = 'center'; ctx.fillStyle = colors.text; ctx.font = font(13);
      ctx.textBaseline = 'middle'; ctx.fillText(t('no_data'), (L + R) / 2, pad.t + ph / 2);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = colors.text; ctx.font = font(11);
    labels.forEach((l, i) => {
      const x = points[i].x;
      const raw = String(l).replace(/^(عيادة|Clinic)\s+/, '');
      const max = Math.max(6, Math.floor((cfg.type === 'bar' ? pw / Math.max(data.length, 1) : 80) / 7));
      const txt = raw.length > max ? raw.slice(0, max - 1) + '…' : raw;
      ctx.fillText(txt, x, H - pad.b + 8);
    });
    if (cfg.type === 'line') {
      const col = colors.line;
      const n = points.length;
      if (n) {
        const upto = p * (n - 1);
        ctx.beginPath();
        const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ph);
        grad.addColorStop(0, hexA(col, .28)); grad.addColorStop(1, hexA(col, 0));
        ctx.moveTo(points[0].x, Y(0));
        let lastX = points[0].x;
        for (let i = 0; i < n; i++) {
          if (i > upto + 1e-6) {
            const f = upto - Math.floor(upto), a = points[i - 1], b = points[i];
            const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
            ctx.lineTo(x, y); lastX = x; break;
          }
          ctx.lineTo(points[i].x, points[i].y); lastX = points[i].x;
        }
        ctx.lineTo(lastX, Y(0)); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          if (i > upto + 1e-6) {
            const f = upto - Math.floor(upto), a = points[i - 1], b = points[i];
            ctx.lineTo(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f); break;
          }
          if (i) ctx.lineTo(points[i].x, points[i].y); else ctx.moveTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
        points.forEach((pt, i) => {
          if (i > upto + 1e-6) return;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, cfg._hover === i ? 6 : 4, 0, Math.PI * 2);
          ctx.fillStyle = colors.surface; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
        });
      }
    } else {
      const bw = cfg._barW;
      points.forEach((pt, i) => {
        const h = (Y(0) - pt.y) * p;
        const x = pt.x - bw / 2, y = Y(0) - h;
        const r = Math.min(7, bw / 2, h);
        ctx.beginPath();
        ctx.moveTo(x, Y(0)); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.lineTo(x + bw - r, y); ctx.quadraticCurveTo(x + bw, y, x + bw, y + r); ctx.lineTo(x + bw, Y(0)); ctx.closePath();
        ctx.fillStyle = cfg._hover === i ? cssVar('--primary-strong') : colors.main; ctx.fill();
        if (p === 1 && pt.v) { ctx.fillStyle = cssVar('--text'); ctx.font = font(11); ctx.textBaseline = 'bottom'; ctx.fillText(fmtNum(pt.v), pt.x, y - 4); }
      });
    }
  }
  cfg._frame = frame;
  if (animate && !REDUCED) {
    const t0 = performance.now();
    const tick = now => { const p = Math.max(0, Math.min(1, (now - t0) / 900)); frame(1 - Math.pow(1 - p, 3)); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  } else frame(1);
  if (!canvas._hooked) {
    canvas._hooked = true;
    canvas.addEventListener('mousemove', e => chartHover(cfg, e));
    canvas.addEventListener('mouseleave', () => { cfg._hover = null; cfg._frame(1); document.getElementById(cfg.tip).classList.remove('show'); });
  }
}
function chartHover(cfg, e) {
  const c = CHARTS[cfg.canvas === 'trendChart' ? 'trend' : 'clinic'] || cfg;
  if (!c._points || !c._points.length) return;
  const r = e.target.getBoundingClientRect();
  const mx = e.clientX - r.left;
  let best = 0, bd = Infinity;
  c._points.forEach((p, i) => { const d = Math.abs(p.x - mx); if (d < bd) { bd = d; best = i; } });
  if (c._hover !== best) { c._hover = best; c._frame(1); }
  const p = c._points[best];
  const tip = document.getElementById(c.tip);
  tip.innerHTML = esc(c.labels[best]) + ' · ' + fmtNum(p.v) + ' ' + esc(t('hours_short')) + (c.extra ? ' · ' + c.extra[best] + ' ' + esc(t('count')) : '');
  tip.style.left = p.x + 'px'; tip.style.top = p.y + 'px';
  tip.classList.add('show');
}
function hexA(hex, a) {
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
}
