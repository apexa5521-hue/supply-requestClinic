const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const store = {
  get(k, d) { try { const v = localStorage.getItem('sf_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sf_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem('sf_' + k); } catch (e) { /* ignore */ } }
};

  get() { try { return JSON.parse(sessionStorage.getItem('sf_session') || 'null'); } catch (e) { return null; } },
  set(v) { try { sessionStorage.setItem('sf_session', JSON.stringify(v)); } catch (e) { /* ignore */ } },
  clear() { try { sessionStorage.removeItem('sf_session'); } catch (e) { /* ignore */ } }
};
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function t(key, vars) {
  let s = (I18N[S.lang] && I18N[S.lang][key]) || I18N.ar[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function icon(name, cls) { return '<svg class="i ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function locale() { return S.lang === 'ar' ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB'; }
function toDate(v) { if (!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; }
function fmtDate(v) { const d = toDate(v); return d ? d.toLocaleDateString(locale(), { timeZone: 'Asia/Riyadh', day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }
function fmtDateTime(v) { const d = toDate(v); return d ? d.toLocaleString(locale(), { timeZone: 'Asia/Riyadh', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; }
function fmtTime(v) { const d = toDate(v); return d ? d.toLocaleTimeString(locale(), { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit' }) : ''; }
function fmtNum(n, dec) { return Number(n || 0).toLocaleString(locale(), { maximumFractionDigits: dec === undefined ? 1 : dec }); }
function monthKey(v) {
  const d = toDate(v); if (!d) return '';
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit' }).formatToParts(d);
  return p.find(x => x.type === 'year').value + '-' + p.find(x => x.type === 'month').value;
}
function relTime(v) {
  const d = toDate(v); if (!d) return '';
  const diff = (d.getTime() - Date.now()) / 1000;
  const abs = Math.abs(diff);
  if (abs < 45) return t('just_now');
  const rtf = new Intl.RelativeTimeFormat(S.lang === 'ar' ? 'ar' : 'en', { numeric: 'auto' });
  if (abs < 3600) return rtf.format(Math.round(diff / 60), 'minute');
  if (abs < 86400) return rtf.format(Math.round(diff / 3600), 'hour');
  if (abs < 86400 * 7) return rtf.format(Math.round(diff / 86400), 'day');
  return fmtDate(d);
}
function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/);
  return (parts[0].charAt(0) + (parts[1] ? parts[1].charAt(0) : '')).toUpperCase();
}
function debounce(fn, ms) { let h; return function () { const a = arguments; clearTimeout(h); h = setTimeout(() => fn.apply(null, a), ms); }; }
function errCode(e) { const m = /ERR_[A-Z_]+/.exec(String((e && e.message) || e)); return m ? m[0] : ''; }
function errMsg(e) {
  const c = errCode(e);
  if (c) return t(c);
  const m = String((e && e.message) || e || '').replace(/^(Exception|Error):\s*/, '');
  return m || t('error_generic');
}
function setList(box, html, animate) {
  box.classList.toggle('stagger', !!animate);
  box.innerHTML = html;
}
function stagger(html, i) { return html.replace(/^<(\w+)/, '<$1 style="--i:' + i + '"'); }

function resetPage(key) { LIMITS[key] = PAGE; }
function moreBtn(key, total) {

}

   Backend transport
   ===================================================================== */
/* عبر google.script.run (داخل Apps Script) كل استدعاء مباشر.
   عبر fetch (GitHub Pages): عمليات القراءة التي تصدر في نفس اللحظة تُجمَّع في طلب واحد (batch)،
   بحد أقصى طلبين متزامنين، مع إعادة محاولة تلقائية للقراءة فقط عند فشل الشبكة. */
const NET = { queue: [], inflight: 0, max: 2, flushTimer: null };
const RETRYABLE = ['ERR_NETWORK', 'ERR_BAD_RESPONSE'];
function isRead(fn) { return /^get/.test(fn); }

function postJson(body) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // نص عادي لتفادي طلب CORS المسبق
    body: JSON.stringify(body)
  }).then(r => {
    if (!r.ok) throw new Error('ERR_NETWORK');
    return r.text();
  }).then(txt => {
    try { return JSON.parse(txt); } catch (e) { throw new Error('ERR_BAD_RESPONSE'); }
  }, e => { throw (e && /^ERR_/.test(e.message)) ? e : new Error('ERR_NETWORK'); });
}
/* نفس الطابور والتجميع سواء كانت الصفحة من Apps Script (google.script.run) أو GitHub Pages (fetch) */
function hasGSR() { return !!(window.google && google.script && google.script.run); }
function transport(body) {
  if (!hasGSR()) return postJson(body);
  return new Promise(res => {
    google.script.run
      .withSuccessHandler(data => res({ ok: true, data: data }))
      .withFailureHandler(e => {
        const msg = String((e && e.message) || e || '');
        res({ ok: false, error: /ERR_[A-Z_]+/.test(msg) ? msg.match(/ERR_[A-Z_]+(:\S*)?/)[0] : 'ERR_NETWORK' });
      })
      .api(body.token, body.fn, body.args);
  });
}
/* الكتابة: «مشغول» تعني أن الخادم لم ينفّذ شيئاً (القفل لم يتوفر) → إعادة المحاولة آمنة */
function busyRetry(fn, tries, n) {
  n = n || 0;
  return fn().catch(e => {
    if (errCode(e) === 'ERR_BUSY' && n < tries) {
      if (n === 0) toast(t('busy_retry'), 'info', 2500);
      return new Promise(r => setTimeout(r, 1200 * (n + 1) + Math.random() * 800)).then(() => busyRetry(fn, tries, n + 1));
    }
    throw e;
  });
}
function withRetry(fn, tries) {
  return fn().catch(e => {
    if (tries > 0 && RETRYABLE.indexOf(errCode(e)) !== -1) {
      return new Promise(r => setTimeout(r, (3 - tries) * 700 + 400)).then(() => withRetry(fn, tries - 1));
    }
    throw e;
  });
}
function pumpQueue() {
  while (NET.inflight < NET.max && NET.queue.length) {
    // اجمع كل القراءات المتتالية في رأس الطابور في دفعة واحدة
    let group = [NET.queue.shift()];
    if (isRead(group[0].fn) && !NET.noBatch) {
      while (NET.queue.length && isRead(NET.queue[0].fn) && group.length < 12) group.push(NET.queue.shift());
    }
    NET.inflight++;
    sendGroup(group).finally(() => { NET.inflight--; pumpQueue(); });
  }
}
function sendGroup(group) {
  const token = S.token;
  if (group.length === 1) {
    const c = group[0];
    const once = () => transport({ token: token, fn: c.fn, args: c.args }).then(res => {
      if (res.ok) return res.data;
      throw new Error(res.error || 'ERR_NETWORK');
    });
    return (isRead(c.fn) ? withRetry(once, 2) : busyRetry(once, 3)).then(c.resolve, c.reject);
  }
  const once = () => transport({ token: token, fn: 'batch', args: [group.map(c => [c.fn, c.args])] }).then(res => {
    if (!res.ok) throw new Error(res.error || 'ERR_NETWORK');
    return res.data;
  });
  return withRetry(once, 2).then(results => {
    group.forEach((c, i) => {
      const r = results[i];
      if (r && r.ok) c.resolve(r.data); else c.reject(new Error((r && r.error) || 'ERR_NETWORK'));
    });
  }, e => {
    // خادم قديم لا يعرف batch → أرسل كل طلب منفرداً من الآن فصاعداً
    if (errCode(e) === 'ERR_UNKNOWN_FN' && !NET.noBatch) {
      NET.noBatch = true;
      return Promise.all(group.map(c => sendGroup([c])));
    }
    group.forEach(c => c.reject(e));
  });
}

/* كاش قراءة في المتصفح: عرض فوري لما فُتح مؤخراً + دمج القراءات المتطابقة المتزامنة.
   أي عملية كتابة ناجحة تمسح الكاش كله حتى لا تُعرض بيانات قديمة بعد تعديل. */
const RC = new Map(), PENDING = new Map();
const rkey = (fn, args) => fn + '|' + JSON.stringify(args);
function peek(fn, args, maxAgeMs) {
  const e = RC.get(rkey(fn, args || []));
  return e && (!maxAgeMs || Date.now() - e.at < maxAgeMs) ? e.data : undefined;
}
/* بعد الدخول بلحظات: تحميل مسبق صامت لبيانات باقي الشاشات في رحلة واحدة (دفعة قراءات) —
   فتح أي تبويب لأول مرة يظهر فوراً ثم يتحدث */
function warmViews() {
  if (!S.user || document.hidden) return;
  const month = todayStr().slice(0, 7), mr = monthRange(month);
  const plan = {
    overview: [['getExecutiveStats', ['']], ['getQualityReport', ['']], ['getQualityTrend', [6]]],
    reports: [['getStatsReport', [Object.assign({ branch: '' }, mr)]]],
    monitor: [['getMonitor', [{ month: month }]]],
    finance: hasPerm('finance') ? [['getFinance', [Object.assign({ branch: '' }, mr)]]] : [],
    labkpi: [['getLabStats', [mr]]],
    labboard: [['getLabCases', [{}]]], labmine: [['getMyLabCases', [{}]]], labdoc: [['getDoctorLabCases', [{}]]],
    complaints: [['getComplaints', [false]]]
  };
  if (hasPerm('prices_edit')) plan.finance.push(['getPriceList', []]);
  navItems().filter(n => n.id !== S.view).forEach(n => (plan[n.id] || []).forEach(c => {
    if (peek(c[0], c[1]) === undefined) call.apply(null, [c[0]].concat(c[1])).catch(() => {});
  }));
}
/* عرض فوري لآخر نسخة معروفة ثم تحديث صامت: render(data, fromCache) — لا يُعاد الرسم إن لم تتغير البيانات */
function swr(fn, args, render, onErr) {
  const hit = peek(fn, args);
  let sig = '';
  if (hit !== undefined) { sig = JSON.stringify(hit); render(hit, true); }
  return call.apply(null, [fn].concat(args)).then(d => { const s2 = JSON.stringify(d); if (s2 !== sig) render(d, false); return d; })
    .catch(e => { if (hit === undefined && onErr) onErr(e); });
}
/* بيانات جاهزة مسبقاً (مع الدخول أو من آخر زيارة للتبويب) تُقدَّم فوراً مرة واحدة */
function seedRC(fn, args, data) {
  // بيانات جديدة من الخادم (مع الدخول): تُقدَّم لكل من يطلبها خلال 8 ثوانٍ
  RC.set(rkey(fn, args || []), { data: data, at: Date.now(), seedUntil: Date.now() + 8000 });
}
const PERSIST = ['getMyRequests', 'getRequests', 'getDoctorRequests', 'getAlerts', 'getNotices', 'getComplaints', 'getExecutiveStats', 'getQualityReport', 'getQualityTrend',
  'getStatsReport', 'getMonitor', 'getFinance', 'getLabCases', 'getMyLabCases', 'getDoctorLabCases', 'getLabStats', 'getLabConfig', 'getPriceList'];
let persistTimer = null;
function persistRC() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    if (!S.user) return;
    const out = [];
    RC.forEach((e, k) => { if (PERSIST.indexOf(k.split('|')[0]) !== -1) out.push([k, e.data]); });
    try { sessionStorage.setItem('sf_rc', JSON.stringify({ u: S.user.name, e: out })); } catch (e) { /* مساحة ممتلئة: تجاهل */ }
  }, 800);
}
function restoreRC(userName) {
  try {
    const o = JSON.parse(sessionStorage.getItem('sf_rc') || 'null');
    if (!o || o.u !== userName) return 0;
    o.e.forEach(([k, d]) => RC.set(k, { data: d, at: 0, seed: true }));
    return o.e.length;
  } catch (e) { return 0; }
}
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  const read = isRead(fn), key = read ? rkey(fn, args) : '';
  if (read) {
    const e = RC.get(key);
    if (e && e.seed) { e.seed = false; return Promise.resolve(e.data); } // من آخر زيارة: مرة واحدة ثم تحديث
    if (e && e.seedUntil > Date.now()) return Promise.resolve(e.data);
  }
  if (read && PENDING.has(key)) return PENDING.get(key);
  const p = new Promise((resolve, reject) => {
    NET.queue.push({ fn: fn, args: args, resolve: resolve, reject: reject });
    clearTimeout(NET.flushTimer);
    NET.flushTimer = setTimeout(pumpQueue, 15); // لحظة قصيرة لتجميع الطلبات المتزامنة
  }).then(data => {
    if (read) {
      RC.delete(key); RC.set(key, { data: data, at: Date.now() });
      if (RC.size > 150) RC.delete(RC.keys().next().value);
      if (PERSIST.indexOf(fn) !== -1) persistRC();
    } else if (fn !== 'login' && fn !== 'logout') RC.clear();
    return data;
  }, e => {
    if (errCode(e) === 'ERR_SESSION' && fn !== 'login' && S.user) sessionExpired();
    if (errCode(e) === 'ERR_CONFLICT' && S.user) { RC.clear(); setTimeout(() => sync(true), 50); }
    throw e;
  });
  if (read) {
    PENDING.set(key, p);
    p.then(() => PENDING.delete(key), () => PENDING.delete(key));
  }
  return p;
}
/* تحميل مسبق عند تمرير المؤشر/اللمس: التفاصيل تكون جاهزة لحظة الضغط */
function prefetch(act, id) {
  if (!S.user || !id) return;
  if (act === 'procToggle') { if (S.proc && !S.proc.items[id]) loadProcItems(id, true); return; }
  if (act === 'review') { if (peek('getRequestItemsWithCatalog', [id], 60000) === undefined) call('getRequestItemsWithCatalog', id).catch(() => {}); return; }
  if (peek('getRequestDetail', [id], 45000) === undefined) call('getRequestDetail', id).catch(() => {});

(function () {
  let timer = null;
  const target = e => e.target && e.target.closest && e.target.closest('[data-act="detail"],[data-act="receive"],[data-act="procToggle"],[data-act="review"]');
  document.addEventListener('pointerover', e => {

function toast(msg, type, ms) {

  const el = document.createElement('div');
  el.className = 'toast ' + type;

  el.innerHTML = '<span class="t-ic">' + icon(ic) + '</span><span class="grow">' + esc(msg) + '</span><span class="t-bar" style="animation-duration:' + ms + 'ms"></span>';
  const root = $('#toasts');

  while (root.children.length > 4) root.firstChild.remove();
  const kill = () => { el.classList.add('leaving'); setTimeout(() => el.remove(), 260); };
  const h = setTimeout(kill, ms);
  el.addEventListener('click', () => { clearTimeout(h); kill(); });
}

/* =====================================================================
   Modals (stack, focus trap, Esc, animated close)
   ===================================================================== */
const MODALS = [];
function openModal(opts) {
  const layer = document.createElement('div');
  layer.className = 'modal-layer';
  layer.innerHTML =
    '<div class="scrim" data-close></div>' +
    '<div class="modal ' + (opts.size || '') + '" role="dialog" aria-modal="true" aria-labelledby="mt' + MODALS.length + '">' +
      '<div class="modal-head">' + (opts.icon ? '<span class="m-ic ' + (opts.tone || '') + '">' + icon(opts.icon) + '</span>' : '') +
        '<div class="grow"><h2 id="mt' + MODALS.length + '">' + opts.title + '</h2>' + (opts.sub ? '<p>' + opts.sub + '</p>' : '') + '</div>' +
        '<button class="btn btn-ghost btn-icon btn-sm" data-close aria-label="' + esc(t('close')) + '">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') +
    '</div>';
  const m = { el: layer, opts: opts, prevFocus: document.activeElement };
  layer._modal = m;
  layer.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(m); });
  $('#modals').appendChild(layer);
  MODALS.push(m);
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    const f = layer.querySelector('[autofocus]') || layer.querySelector('.modal-body input:not([type=hidden]):not([disabled]), .modal-body textarea, .modal-body select');
    const md = layer.querySelector('.modal');
    if (f && !('ontouchstart' in window)) f.focus(); else { md.setAttribute('tabindex', '-1'); md.focus({ preventScroll: true }); }
  }, 60);
  if (opts.onOpen) opts.onOpen(layer, m);
  return m;
}
function closeModal(m) {
  if (!m || m.closing) return;
  if (m.opts.onClose && m.opts.onClose() === false) return;
  m.closing = true;
  m.el.classList.add('closing');
  const i = MODALS.indexOf(m);
  if (i !== -1) MODALS.splice(i, 1);
  setTimeout(() => {
    m.el.remove();
    if (!MODALS.length) document.body.style.overflow = '';
    if (m.prevFocus && m.prevFocus.focus && document.contains(m.prevFocus)) m.prevFocus.focus();
  }, REDUCED ? 0 : 200);
}
function topModal() { return MODALS[MODALS.length - 1]; }
document.addEventListener('keydown', e => {
  const m = topModal();
  if (!m) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(m); }
  if (e.key === 'Tab') {
    const f = $$('button:not([disabled]), [href], input:not([disabled]):not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])', m.el)
      .filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
function confirmDialog(msg, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    let answered = false;
    const m = openModal({
      title: esc(opts.title || t('confirm')), icon: opts.icon || 'alert', tone: opts.danger ? 'danger' : 'warn', size: 'sm',
      body: '<p>' + esc(msg) + '</p>',
      foot: '<span class="spacer"></span><button class="btn" data-close>' + esc(t('cancel')) + '</button>' +
            '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-yes autofocus>' + esc(opts.ok || t('confirm')) + '</button>',
      onClose: () => { if (!answered) resolve(false); }
    });
    m.el.querySelector('[data-yes]').addEventListener('click', () => { answered = true; resolve(true); closeModal(m); });
  });
}
function busy(btn, on, label) {
  if (!btn) return;

    btn._html = btn.innerHTML; btn.disabled = true;

  } else if (btn._html !== undefined) {

  }
}

function updateSyncTime() { $('#syncTime').textContent = S.lastSync ? fmtTime(S.lastSync) : ''; }
function sync(silent) {
  const btn = $('#syncBtn');
  btn.classList.add('syncing');
  RC.forEach(e => { e.seed = false; e.seedUntil = 0; }); // المزامنة تجلب من الخادم دائماً
  // كل القراءات تُطلق معاً فتُجمع في طلب واحد للخادم؛ الإعدادات تتغير نادراً → كل 5 دقائق
  const cfgDue = !silent || !S.cfgAt || Date.now() - S.cfgAt > 5 * 60 * 1000;
  const cfg = cfgDue ? call('getConfig').then(c => {
    applyConfig(c); S.cfgAt = Date.now(); session.set({ token: S.token, cfg: c });
    // تغيّرت صلاحيات الدور (من الأدمن): القائمة تتحدث، والشاشة الحالية تُغلق إن لم تعد مسموحة
    renderNav();
    if (S.view && !navItems().some(n => n.id === S.view)) { const f = navItems()[0]; if (f) go(f.id); }
  }) : Promise.resolve();
  const v = VIEWS[S.view];
  if (v && v.refresh) v.refresh(silent);
  loadAlerts();
  return cfg.then(() => {
    S.lastSync = new Date(); updateSyncTime();
    if (!silent) toast(t('done'), 'info', 1600);
  }).catch(e => { if (!silent) toast(errMsg(e), 'error'); })
    .finally(() => btn.classList.remove('syncing'));
}

function stepperHtml(r) {
  const cur = stMeta(r.status).step;
  const rejected = r.status === ST.REJECTED;
  const steps = [
    { k: 'step_submitted', ic: 'clipboard', at: r.submittedAt },
    { k: 'step_review', ic: 'steth', at: r.reviewAt },
    { k: 'step_approved', ic: rejected ? 'x' : 'check', at: rejected ? r.reviewedAt : (r.approvedAt || (r.status === ST.APPROVED ? r.reviewedAt : '')) },
    { k: 'step_prep', ic: 'package', at: r.prepAt },
    { k: 'step_sent', ic: 'truck', at: r.sentAt },
    { k: 'step_received', ic: 'pen', at: r.receivedAt }
  ];
  return '<div class="stepper">' + steps.map((s, i) => {
    let cls = 'todo';
    if (rejected && i === 2) cls = 'failed';
    else if (i < cur || (i === cur && (r.status === ST.RECEIVED))) cls = 'done';
    else if (i === cur) cls = 'current';
    if (s.at && cls === 'todo') cls = 'done';
    const lbl = rejected && i === 2 ? t('st_rejected') : t(s.k);
    return '<div class="step ' + cls + '"><span class="node">' + icon(cls === 'done' ? 'check' : s.ic) + '</span><span class="s-lbl">' + esc(lbl) + '</span><span class="s-time">' + (s.at ? esc(fmtDateTime(s.at)) : '&nbsp;') + '</span></div>';
  }).join('') + '</div>';
}

/** فترة رفع الطلب الشهري: من 15 إلى 20 (بتوقيت الرياض) */
const MONTHLY_WINDOW = [15, 20];
/* بعد يوم 20: الرفع متاح عادي لكنه يُعلَّم «رُفع متأخراً» — لا يُمنع أبداً */
function pastMonthlyWindow() {
  const d = Number(new Date().toLocaleString('en-US', { timeZone: 'Asia/Riyadh', day: 'numeric' }));
  return d > MONTHLY_WINDOW[1];
}
/** الطبيب في بطاقة الطلب — أو «مستهلكات عيادة» للطلب بدون طبيب */
function docLabel(r) { return r.doctor || t('kind_clinic'); }
function nurseDraft() {
  if (!S.nurse.draft) {
    const saved = store.get('draft_' + S.user.name, null);
    S.nurse.draft = saved && Array.isArray(saved.items) ? saved : { kind: 'doctor', clinic: '', doctor: '', type: 'شهري', items: [] };
    if (S.nurse.draft.kind !== 'clinic' && S.nurse.draft.kind !== 'lab') S.nurse.draft.kind = 'doctor';
    if (!S.nurse.draft.key) S.nurse.draft.key = uid();
    if (saved && saved.items && saved.items.length) setTimeout(() => toast(t('draft_restored'), 'info'), 400);
  }
  return S.nurse.draft;
}
/* المسودة تُحفظ على الجهاز مع كل تعديل — لا تضيع إن انقطع الاتصال أو انتهت الجلسة أو أُغلقت الصفحة.
   key يميّز المسودة: إعادة إرسالها بعد انقطاع لا تنشئ طلباً مكرراً (الخادم يتعرف عليها) */
function saveDraft() {
  const d = S.nurse.draft; if (!d || !S.user) return;
  d.savedAt = Date.now();
  store.set('draft_' + S.user.name, d);
  renderDraftState();
}
function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* ignore */ }
  return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
function renderDraftState() {
  const box = $('#draftState'); const d = S.nurse.draft; if (!box || !d) return;
  const has = d.items.length > 0;

function setupCombo() {
  const inp = $('#itemSearch'), list = $('#comboList');
  let opts = [], active = -1;
  const close = () => { list.classList.add('hidden'); inp.setAttribute('aria-expanded', 'false'); active = -1; };
  const hl = (name, q) => {
    if (!q) return esc(name);
    const i = name.toLowerCase().indexOf(q.toLowerCase());
    return i === -1 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
  };
  const render = () => {
    const q = inp.value.trim();
    const ql = q.toLowerCase();
    const matches = S.catalog.filter(c => !ql || c.name.toLowerCase().indexOf(ql) !== -1 || (c.commercial || '').toLowerCase().indexOf(ql) !== -1 || (c.category || '').toLowerCase().indexOf(ql) !== -1)
      .sort((a, b) => (a.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1) - (b.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1) || a.name.localeCompare(b.name));
    // كل الأصناف تظهر (بالتمرير)، والبحث يصفّيها — بلا حد أعلى
    // الطلب من الكتالوج فقط — لا يمكن كتابة صنف جديد باسم حر
    opts = matches.map(c => ({ name: c.name, c: c }));
    active = opts.length ? 0 : -1;
    if (!opts.length) {
      list.innerHTML = '<div class="combo-empty">' + esc(S.catalog.length ? t('no_items_match') : t('catalog_empty')) + (S.catalog.length ? '<div class="hint" style="margin-top:4px">' + esc(t('catalog_only_hint')) + '</div>' : '') + '</div>';
    } else {
      const added = {};
      nurseDraft().items.forEach(it => { added[it.name.toLowerCase()] = it.qty; });
      list.innerHTML = '<div class="combo-head">' + esc(t(q ? 'items_found' : 'items_all', { n: matches.length, total: S.catalog.length })) + '</div>' + opts.map((o, i) =>
        '<div class="combo-opt" role="option" data-i="' + i + '" aria-selected="' + (i === active) + '"><span class="ic">' + icon('package') + '</span><div class="grow"><div class="nm">' + hl(o.name, q) + '</div>' +
          ((o.c.commercial || o.c.category || o.c.price) ? '<div class="mt">' + esc([o.c.commercial, o.c.category].filter(Boolean).join(' · ')) + (o.c.price ? ' · ' + fmtNum(o.c.price, 2) + ' ' + esc(t('currency')) : '') + '</div>' : '') + '</div>' +
          (added[o.name.toLowerCase()] ? '<span class="combo-added">' + icon('check', 'i-sm') + '×' + added[o.name.toLowerCase()] + '</span>' : '') + '</div>').join('');
    }
    list.classList.remove('hidden');
    inp.setAttribute('aria-expanded', 'true');
  };
  const setActive = i => {
    active = i;
    $$('.combo-opt', list).forEach((el, j) => { el.setAttribute('aria-selected', String(j === i)); if (j === i) el.scrollIntoView({ block: 'nearest' }); });
  };
  const pick = i => {
    const o = opts[i]; if (!o) return;
    addItem(o.name, 1);
    inp.value = '';
    render();
    inp.focus();
  };
  inp.addEventListener('input', render);
  inp.addEventListener('focus', render);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.classList.contains('hidden')) render(); else setActive(Math.min(active + 1, opts.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); if (active >= 0) pick(active); }
    else if (e.key === 'Escape') { if (!list.classList.contains('hidden')) { e.stopPropagation(); close(); } }
  });
  list.addEventListener('mousedown', e => { const o = e.target.closest('.combo-opt'); if (o) { e.preventDefault(); pick(Number(o.dataset.i)); } });
  inp.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== inp) close(); }, 120));
}

  if (l && !e.target.closest('#combo')) { l.classList.add('hidden'); $('#itemSearch').setAttribute('aria-expanded', 'false'); }

/*
 * إرسال المسودة. عند تعذّر الإرسال (انقطاع/خادم مشغول) تُعلَّم «بانتظار الإرسال» ويُعاد إرسالها تلقائياً

const AUTO_SEND = { timer: 0, tries: 0, delay: 20000 };
function sendDraft(el, auto) {
  const d = nurseDraft();
  const err = $('#submitErr');
  if (!d.items.length || AUTO_SEND.sending) return;
  clearTimeout(AUTO_SEND.timer);
  if (navigator.onLine === false) { markPending(d, err, 'offline_kept'); return; }
  AUTO_SEND.sending = true;
  if (el) busy(el, true, t('sending'));
  const byClinic = d.kind === 'clinic';
  call('createRequest', { clinic: byClinic ? d.clinic : '', branch: d.branch || '', doctor: byClinic ? '' : d.doctor, type: d.type, items: d.items.map(i => ({ name: i.name, qty: Number(i.qty) })), clientKey: d.key })
    .then(res => {
      AUTO_SEND.sending = false; AUTO_SEND.tries = 0;
      if (el) busy(el, false);
      // duplicate = هذه المسودة وصلت الخادم سابقاً (مثلاً انقطع الاتصال قبل وصول الرد) — لا طلب مكرر
      if (res && res.duplicate) toast(t('duplicate_request', { id: res.id }), 'info', 5000);
      else toast(t('request_sent', { id: res.id }), 'success', 5000);
      d.items = []; d.key = uid(); d.pending = false; saveDraft();
      if (err) err.classList.add('hidden');
      if (S.view === 'new') renderItems();
      S.loaded.mine = false;
      loadMine(true);
    })
    .catch(e => {
      AUTO_SEND.sending = false;
      if (el) busy(el, false);
      if (errCode(e) === 'ERR_SESSION') { d.pending = true; saveDraft(); return; } // بعد الدخول تُرسل تلقائياً
      const lost = ['ERR_NETWORK', 'ERR_BAD_RESPONSE', 'ERR_BUSY', 'ERR_TIMEOUT'].indexOf(errCode(e)) !== -1;
      if (lost) { markPending(d, err, 'send_auto_retry'); return; }
      d.pending = false; saveDraft();
      if (err) { err.querySelector('span').textContent = errMsg(e); err.classList.remove('hidden'); }
      else toast(errMsg(e), 'error', 6000);
    });
}
function markPending(d, err, k) {
  d.pending = true; saveDraft();
  AUTO_SEND.tries++;
  const box = err || $('#submitErr');
  if (box) { box.querySelector('span').textContent = t(k); box.classList.remove('hidden'); }
  if (AUTO_SEND.tries === 1 && !box) toast(t(k), 'warning', 5000);
  clearTimeout(AUTO_SEND.timer);
  AUTO_SEND.timer = setTimeout(() => { if (S.user && S.nurse.draft && S.nurse.draft.pending) sendDraft($('#submitBtn'), true); }, Math.min(AUTO_SEND.delay * AUTO_SEND.tries, 120000));
}

  if (!S.user || S.user.screen !== 'nurse') return;

function signaturePad(canvas, wrap) {
  let ctx, drawing = false, ink = false, last = null;

    const r = canvas.getBoundingClientRect();

    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14201c'; ctx.lineWidth = 2.4;
    ink = false; wrap.classList.remove('inked');
  };
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(last.x, last.y); e.preventDefault(); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    const mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
    ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(mid.x, mid.y);
    last = p;
    if (!ink) { ink = true; wrap.classList.add('inked'); }
    e.preventDefault();
  });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);
  requestAnimationFrame(setup);
  return { clear: setup, hasInk: () => ink, toDataURL: () => canvas.toDataURL('image/png'), canvas: canvas };
}
/* صورة إيصال: قسم لكل شحنة (أصنافها + المستلم + التوقيع). combined = الإيصال الموحّد للطلب المكتمل */
function drawReceipt(id, sections, combined) {

    x.fillStyle = '#555'; x.font = '13px Arial, sans-serif';

      x.fillText('Received ' + when(s.at), W - 20, y + 20);
      y += 34;
      x.fillStyle = '#e8f4f0'; x.fillRect(20, y, W - 40, rowH);
      x.fillStyle = '#3d8fc8'; x.font = 'bold 13px Arial, sans-serif';
      x.textAlign = 'left'; x.fillText('Item', 30, y + 19);
      x.textAlign = 'center'; x.fillText('Sent', W - 170, y + 19); x.fillText('Received', W - 70, y + 19);
      y += rowH;
      s.items.forEach((it, i) => {
        x.fillStyle = i % 2 ? '#fff' : '#fafafa'; x.fillRect(20, y, W - 40, rowH);
        x.strokeStyle = '#e5e9e7'; x.strokeRect(20, y, W - 40, rowH);
        x.fillStyle = '#222'; x.font = '13px Arial, sans-serif';
        x.textAlign = 'left'; x.direction = /[؀-ۿ]/.test(it.item) ? 'rtl' : 'ltr';
        if (x.direction === 'rtl') { x.textAlign = 'right'; x.fillText(String(it.item), W - 230, y + 19, 400); } else x.fillText(String(it.item), 30, y + 19, 440);
        x.direction = 'ltr'; x.textAlign = 'center';
        x.fillText(String(it.sent), W - 170, y + 19);
        x.fillStyle = it.got !== '' && Number(it.got) < Number(it.sent) ? '#c93a3a' : '#222';
        x.fillText(String(it.got === '' ? '—' : it.got), W - 70, y + 19);
        y += rowH;
      });
      y += 22;
      x.fillStyle = '#333'; x.font = 'bold 13px Arial, sans-serif'; x.textAlign = 'left';
      x.fillText('Receiver: ', 30, y);
      x.font = '13px Arial, sans-serif'; x.fillText(String(s.receiver || '—'), 100, y);
      y += 8;
      x.strokeStyle = '#d8dfdb'; x.strokeRect(30, y, 240, sigH);
      if (s.sig) x.drawImage(s.sig, 30, y, 240, sigH);
      x.fillStyle = '#888'; x.font = '11px Arial, sans-serif'; x.fillText(s.sig ? 'Signature' : 'No signature', 30, y + sigH + 16);
      y += sigH + 32;

function printReport(html) {
  let area = document.getElementById('printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = html;
  const theme = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = 'light'; // الورق أبيض دائماً
  document.body.classList.add('printing');
  let finished = false;
  const done = () => {
    if (finished) return; finished = true;
    document.body.classList.remove('printing'); area.innerHTML = '';
    document.documentElement.dataset.theme = theme;
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);

function exportReportCsv(d, range) {

    ['#', t('date'), t('branch'), t('clinic'), t('status'), t('items'), t('qty'), t('rep_price'), t('rep_line_total')].map(q).join(',')];
  d.rows.forEach(r => r.items.forEach(it => lines.push([r.id, fmtDate(r.date), r.branch, r.clinic, statusLabel(r.status), it.item, it.qty, it.price, it.total].map(q).join(','))));
  lines.push(['', '', '', '', '', t('rep_total'), d.summary.qty, '', d.summary.total].map(q).join(','));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'report-' + (d.doctor || 'doctor').replace(/[^\w\u0600-\u06FF-]+/g, '_') + '-' + (range.from || 'all') + '_' + range.to + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function openReview(id) {
  const r = S.doc.list.find(x => x.id === id) || { id: id };
  const canReview = !!r.awaitingDoctor || r.status === ST.REVIEW;
  const m = openModal({
    title: esc(t('review_title')) + ' · <span class="mono">' + esc(id) + '</span>',
    sub: esc([r.clinic, r.nurse, fmtDate(r.date)].filter(Boolean).join(' · ')), icon: 'steth', size: 'lg',
    body: '<div class="row-wrap">' + badge(r.status) + typeTag(r.type) + branchTag(r.branch) + '</div>' +
      (r.rejectionReason ? '<div class="reject-box">' + icon('xc') + '<div><b>' + esc(t('rejection_reason')) + ':</b> ' + esc(r.rejectionReason) + '</div></div>' : '') +
      '<div id="rvItems">' + skeletonList(1) + '</div>' +
      (canReview
        ? '<div class="field"><label for="rvReason">' + esc(t('review_reason')) + '</label><textarea class="textarea" id="rvReason" maxlength="1000" placeholder="' + esc(t('review_reason_ph')) + '"></textarea></div>' +
          '<div class="field-error hidden" id="rvErr">' + icon('alert', 'i-sm') + '<span></span></div>'
        : '<div class="hint">' + icon('info', 'i-sm') + ' ' + esc(t('review_readonly')) + '</div>'),
    foot: '<button class="btn btn-ghost btn-sm" data-act="detail" data-id="' + esc(id) + '">' + icon('eye', 'i-sm') + esc(t('details')) + '</button>' +
      '<button class="btn btn-danger-soft btn-sm" data-act="complaint" data-id="' + esc(id) + '">' + icon('alert', 'i-sm') + esc(t('report')) + '</button><span class="spacer"></span>' +
      (canReview
        ? '<button class="btn btn-danger" id="rvReject">' + icon('x', 'i-sm') + esc(t('reject')) + '</button><button class="btn btn-primary" id="rvApprove">' + icon('check', 'i-sm') + esc(t('approve')) + '</button>'
        : '<button class="btn" data-close>' + esc(t('close')) + '</button>')
  });
  const cachedItems = peek('getRequestItemsWithCatalog', [id], 60000);
  (cachedItems !== undefined ? Promise.resolve(cachedItems) : call('getRequestItemsWithCatalog', id)).then(items => {
    if (m.closing) return;
    let total = 0;
    const qOf = it => Number(it.approvedQty !== '' && it.approvedQty !== null ? it.approvedQty : it.requestedQty) || 0;
    const rows = items.map((it, i) => {
      const q = qOf(it);
      const line = (Number(it.price) || 0) * q; total += line;
      return '<tr><td><div style="font-weight:600">' + esc(it.item) + '</div>' + ((it.commercial || it.category) ? '<div class="hint">' + esc([it.commercial, it.category].filter(Boolean).join(' · ')) + '</div>' : '') +
        (it.notes && it.notes.length ? '<div class="hint">' + icon('msg', 'i-sm') + ' ' + esc(it.notes.map(n => n.author + ': ' + n.note).join(' · ')) + '</div>' : '') + '</td>' +
        (canReview
          ? '<td class="num"><div class="hint">' + esc(t('requested')) + ': ' + esc(it.requestedQty) + '</div><input class="input rvQty" type="number" min="0" step="1" inputmode="numeric" value="' + q + '" data-i="' + i + '" data-item="' + esc(it.item) + '" data-orig="' + q + '" aria-label="' + esc(t('qty')) + ' — ' + esc(it.item) + '"></td>'
          : '<td class="num">' + esc(q) + '</td>') +
        '<td class="num">' + (it.price ? fmtNum(it.price, 2) : '—') + '</td><td class="num rvLine" data-i="' + i + '">' + (line ? fmtNum(line, 2) : '—') + '</td>' +
        (canReview ? '<td><input class="input rvNote" data-item="' + esc(it.item) + '" maxlength="500" placeholder="' + esc(t('item_note_ph')) + '" style="width:100%;min-width:140px"></td>' : '') + '</tr>';
    }).join('');
    $('#rvItems', m.el).innerHTML = '<div class="table-wrap"><table class="table rv-table"><thead><tr><th>' + esc(t('items')) + '</th><th class="num">' + esc(canReview ? t('approved_qty') : t('qty')) + '</th><th class="num">' + esc(t('price')) + '</th><th class="num">' + esc(t('est_total')) + '</th>' + (canReview ? '<th>' + esc(t('notes')) + '</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (canReview ? '<div class="hint" style="margin-top:8px">' + icon('info', 'i-sm') + ' ' + esc(t('doctor_qty_hint')) + '</div>' : '') +
      '<div class="between rv-total" style="margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--primary-soft);color:var(--primary-strong);font-weight:700' + (total || canReview ? '' : ';display:none') + '"><span>' + esc(t('est_total')) + '</span><span class="mono" id="rvTotal">' + fmtNum(total, 2) + ' ' + esc(t('currency')) + '</span></div>';
    if (canReview) {
      // تعديل الكمية يعيد حساب إجمالي السطر والإجمالي التقديري فوراً
      m.el.addEventListener('input', e => {
        const inp = e.target.closest('.rvQty'); if (!inp) return;
        const it = items[Number(inp.dataset.i)];
        const v = Math.floor(Number(inp.value));
        const bad = inp.value.trim() === '' || !(v >= 0);
        inp.classList.toggle('invalid', bad);
        inp.classList.toggle('changed', !bad && String(v) !== inp.dataset.orig);
        const line = bad ? 0 : (Number(it.price) || 0) * v;
        $('.rvLine[data-i="' + inp.dataset.i + '"]', m.el).textContent = line ? fmtNum(line, 2) : '—';
        const sum = $$('.rvQty', m.el).reduce((a, x) => a + (Number(items[Number(x.dataset.i)].price) || 0) * (Math.max(0, Math.floor(Number(x.value))) || 0), 0);
        $('#rvTotal', m.el).textContent = fmtNum(sum, 2) + ' ' + t('currency');
      });
    }
  }).catch(e => { $('#rvItems', m.el).innerHTML = emptyState('alert', errMsg(e)); });
  if (!canReview) return;
  const submit = (decision, btn) => {
    const reason = $('#rvReason', m.el).value.trim();
    const err = $('#rvErr', m.el);
    err.classList.add('hidden');
    if (decision === 'رفض' && !reason) { err.querySelector('span').textContent = t('reason_required'); err.classList.remove('hidden'); $('#rvReason', m.el).focus(); return; }
    let qtys = [];
    if (decision === 'اعتمد') {
      const bad = $$('.rvQty', m.el).find(i => i.value.trim() === '' || !(Math.floor(Number(i.value)) >= 0));
      if (bad) { err.querySelector('span').textContent = t('ERR_BAD_QTY'); err.classList.remove('hidden'); bad.focus(); return; }
      qtys = $$('.rvQty', m.el).map(i => ({ item: i.dataset.item, qty: Math.floor(Number(i.value)) }));
      if (qtys.length && qtys.every(x => x.qty === 0)) { err.querySelector('span').textContent = t('ERR_ALL_ZERO'); err.classList.remove('hidden'); return; }
    }
    const go2 = () => {
      const notes = $$('.rvNote', m.el).map(i => ({ item: i.dataset.item, note: i.value.trim() })).filter(n => n.note);
      // تحديث فوري للواجهة؛ الحفظ يكتمل في الخلفية، وعند الفشل نُرجع القائمة من الخادم ونعرض الخطأ
      const r = S.doc.list.find(x => x.id === id);
      const prev = r ? r.status : null;
      if (r) { r.status = decision === 'اعتمد' ? ST.APPROVED : ST.REJECTED; r.awaitingDoctor = false; if (decision === 'رفض') r.rejectionReason = reason; }
      closeModal(m);
      if (S.view === 'reviews') renderDoc(false);
      renderNav();
      toast(decision === 'اعتمد' ? t('approved_ok') : t('rejected_ok'), decision === 'اعتمد' ? 'success' : 'warning');
      call('doctorReview', id, decision, reason, notes, qtys).then(() => { loadDoc(true); loadAlerts(); })
        .catch(e => {
          if (r && prev) { r.status = prev; r.awaitingDoctor = true; }
          if (S.view === 'reviews') renderDoc(false);
          toast(t('save_failed', { id: id }) + ' — ' + errMsg(e), 'error', 6000);
          loadDoc(true);
        });
    };
    if (decision === 'رفض') confirmDialog(t('confirm_reject', { id: id }), { danger: true, ok: t('reject'), icon: 'xc' }).then(ok => { if (ok) go2(); });
    else go2();
  };
  $('#rvApprove', m.el).addEventListener('click', e => submit('اعتمد', e.currentTarget));
  $('#rvReject', m.el).addEventListener('click', e => submit('رفض', e.currentTarget));
}

function countUp(root, instant) {
  $$('[data-count]', root).forEach(el => {
    const to = Number(el.dataset.count) || 0;
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix ? '<small>' + esc(el.dataset.suffix) + '</small>' : '';
    if (REDUCED || instant || to === 0) { el.innerHTML = fmtNum(to, dec) + suffix; return; }

function drawChart(cfg, animate) {

ACT.fnCsv = () => {
  const d = FN.data; if (!d) return;
  const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const s = d.summary;
  const lines = [[t('nav_finance'), periodLabel(FN.range), d.branch || t('all_branches')].map(q).join(','), '',
    [t('fn_requests'), t('fn_requested'), t('fn_approved'), t('fn_saving'), t('fn_dispatched'), t('fn_received')].map(q).join(','),
    [s.requests, s.requested, s.approved, s.reviewSaving, s.dispatched, s.received].map(q).join(',')];
  const block = (title, rows) => {
    lines.push('', q(title), [title, t('rep_requests'), t('rp_value'), t('rp_avg_request')].map(q).join(','));
    rows.forEach(r => lines.push([r.name, r.requests - r.rejected, r.value, r.avgValue].map(q).join(',')));
  };
  block(t('rp_by_branch'), d.branches); block(t('rp_by_clinic'), d.clinics); block(t('rp_by_doctor'), d.doctors);
  lines.push('', q(t('fn_trend')), [t('month'), t('rp_value')].map(q).join(','));
  d.trend.forEach(x => lines.push([x.month, x.value].map(q).join(',')));

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'finance-' + (FN.range.from || 'all') + '_' + (FN.range.to || 'all') + '.csv';

function fileToJpeg(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ERR_BAD_IMAGE')); };
    img.src = url;
  });
}

ACT.labKpiCsv = () => {
  const st = LAB.stats; if (!st) return;
  const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const lines = [[t('nav_lab_kpi'), periodLabel(LAB.statsRange)].map(q).join(',')];
  const block = (title, rows) => {
    lines.push('', q(title), [title, t('lab_k_items'), t('lab_k_avg'), t('lab_k_ontime'), t('lab_k_redo'), t('lab_k_overdue'), t('lab_k_cost')].map(q).join(','));
    rows.forEach(r => lines.push([r.name + (r.type ? ' (' + r.type + ')' : ''), r.items, r.avgDays, r.onTimeRate, r.redo, r.overdue, r.cost].map(q).join(',')));
  };
  block(t('lab_by_lab'), st.labs); block(t('lab_by_type'), st.workTypes); block(t('lab_kind'), st.kinds);
  lines.push('', q(t('lab_reasons'))); st.reasons.forEach(r => lines.push([r.reason, r.count].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lab-kpis.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

      '</div>' +

        clinicNames().map(n => '<button type="button" class="chip" data-v="' + esc(n) + '" aria-pressed="' + (clinicsSel.indexOf(n) !== -1) + '">' + esc(n) + '</button>').join('') + '</div></div>' +

  if (!S.user || TOUR.active) return;

  const sc = S.user.screen;
  const mg = isMgmt();
  TOUR.steps = [{ center: true, t: 'tour_welcome_t', b: 'tour_welcome_' + (mg ? (hasPerm('users') ? 'admin' : 'dashboard') : sc), icon: 'sparkle' }]
    .concat(mg ? mgmtTourSteps() : (TOUR_STEPS[sc] || []), TOUR_TAIL);
  TOUR.i = 0; TOUR.dir = 1; TOUR.active = true; TOUR.startView = S.view;
  const block = document.createElement('div'); block.className = 'tour-block';
  const spot = document.createElement('div'); spot.className = 'tour-spot center';
  const card = document.createElement('div'); card.className = 'tour-card'; card.setAttribute('role', 'dialog'); card.setAttribute('aria-modal', 'true');
  document.body.append(block, spot, card);
  TOUR.els = { block: block, spot: spot, card: card };
  block.addEventListener('click', e => e.stopPropagation());
  window.addEventListener('resize', tourReposition);
  window.addEventListener('scroll', tourReposition, true);
  document.addEventListener('keydown', tourKeys, true);
  showTourStep(0);
}
function endTour() {
  if (!TOUR.active) return;
  TOUR.active = false;
  store.set(tourKey(), true);
  window.removeEventListener('resize', tourReposition);
  window.removeEventListener('scroll', tourReposition, true);
  document.removeEventListener('keydown', tourKeys, true);
  const els = TOUR.els;
  Object.keys(els).forEach(k => { els[k].style.transition = 'opacity .2s'; els[k].style.opacity = '0'; });
  setTimeout(() => Object.keys(els).forEach(k => els[k].remove()), REDUCED ? 0 : 220);
  if (TOUR.startView && S.view !== TOUR.startView) go(TOUR.startView);
}
function tourKeys(e) {
  if (!TOUR.active) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endTour(); }
  else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); tourNext(); }
  else if (e.key === 'Tab') { // إبقاء التركيز داخل بطاقة الجولة
    const f = $$('button', TOUR.els.card); if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
}
function tourNext() { if (TOUR.i >= TOUR.steps.length - 1) endTour(); else { TOUR.dir = 1; showTourStep(TOUR.i + 1); } }
function tourBack() { if (TOUR.i > 0) { TOUR.dir = -1; showTourStep(TOUR.i - 1); } }

function showTourStep(i) {
  const st = TOUR.steps[i];
  if (!st) return endTour();
  TOUR.i = i;
  const token = TOUR.token = {};
  const proceed = el => {
    if (token !== TOUR.token || !TOUR.active) return;
    if (!el && st.optional) { const n = i + TOUR.dir; return n >= 0 && n < TOUR.steps.length ? showTourStep(n) : endTour(); }
    if (el && st.up) el = el.closest(st.up) || el;
    TOUR.target = el;
    renderTourCard(st);
    if (el) {
      el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' });
      setTimeout(() => { if (token === TOUR.token) tourReposition(); }, REDUCED ? 0 : 380);
    }
    tourReposition();
  };
  if (st.center) return proceed(null);
  if (st.view && S.view !== st.view) go(st.view);
  waitForEl(st.sel, st.view ? 2500 : 600).then(proceed);
}
function renderTourCard(st) {
  const card = TOUR.els.card;
  const center = !TOUR.target;
  const real = TOUR.steps.length;
  const last = TOUR.i === real - 1;
  card.className = 'tour-card' + (center ? ' center-card' : '');
  card.innerHTML =
    '<div class="t-head"><span class="t-ic">' + icon(st.icon === 'sparkle' ? 'package' : (st.icon || 'info')) + '</span>' +
      '<div class="grow"><h3 id="tourTitle">' + esc(t(st.t, { n: (S.user.name || '').split(' ')[0] })) + '</h3>' +
      '<div class="t-step">' + esc(t('tour_of', { a: TOUR.i + 1, b: real })) + '</div></div></div>' +
    '<p>' + esc(t(st.b)) + '</p>' +
    '<div class="t-dots">' + TOUR.steps.map((x, k) => '<i class="' + (k <= TOUR.i ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<div class="t-foot">' +
      (last ? '' : '<button class="btn btn-ghost btn-sm" data-tour="skip">' + esc(t('tour_skip')) + '</button>') +
      '<span class="spacer"></span>' +
      (TOUR.i > 0 ? '<button class="btn btn-sm" data-tour="back">' + esc(t('tour_back')) + '</button>' : '') +
      '<button class="btn btn-primary btn-sm" data-tour="next">' + esc(TOUR.i === 0 ? t('tour_start') : (last ? t('tour_done') : t('tour_next'))) + '</button>' +
    '</div>' + (center ? '' : '<span class="t-arrow"></span>');
  card.setAttribute('aria-labelledby', 'tourTitle');
  card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
  card.querySelector('[data-tour="next"]').addEventListener('click', tourNext);
  const sk = card.querySelector('[data-tour="skip"]'); if (sk) sk.addEventListener('click', endTour);
  const bk = card.querySelector('[data-tour="back"]'); if (bk) bk.addEventListener('click', tourBack);
  setTimeout(() => { const n = card.querySelector('[data-tour="next"]'); if (n && TOUR.active) n.focus({ preventScroll: true }); }, 60);
}
function tourReposition() {
  if (!TOUR.active) return;
  cancelAnimationFrame(TOUR.raf);
  TOUR.raf = requestAnimationFrame(() => {
    const els = TOUR.els, el = TOUR.target;
    if (!el || !document.contains(el)) {
      els.spot.classList.add('center');
      els.spot.removeAttribute('style');
      if (el) { TOUR.target = null; renderTourCard(TOUR.steps[TOUR.i]); }
      return;
    }
    els.spot.classList.remove('center');
    const r = el.getBoundingClientRect(), pad = 6, vw = window.innerWidth, vh = window.innerHeight;
    const top = Math.max(r.top - pad, 4), left = Math.max(r.left - pad, 4);
    const w = Math.min(r.width + pad * 2, vw - left - 4), h = Math.min(r.bottom + pad, vh - 4) - top;
    Object.assign(els.spot.style, { top: top + 'px', left: left + 'px', width: w + 'px', height: Math.max(h, 24) + 'px' });
    const card = els.card, cw = card.offsetWidth, ch = card.offsetHeight, gap = 14, m = 12;
    let ct, below = true;
    if (r.bottom + gap + ch <= vh - m) ct = r.bottom + gap;
    else if (r.top - gap - ch >= m) { ct = r.top - gap - ch; below = false; }
    else ct = vh - ch - m;
    let cl = r.left + r.width / 2 - cw / 2;
    cl = Math.min(Math.max(cl, m), vw - cw - m);
    card.style.top = ct + 'px';
    card.style.left = cl + 'px';
    const arrow = card.querySelector('.t-arrow');
    if (arrow) {
      const cr = card.getBoundingClientRect();
      const ax = Math.min(Math.max(r.left + r.width / 2 - cr.left - 7, 16), cr.width - 30);
      const overlapping = ct < r.bottom && ct + ch > r.top;
      arrow.style.display = overlapping ? 'none' : '';
      arrow.style.left = ax + 'px';
      arrow.style.top = below ? '-8px' : '';
      arrow.style.bottom = below ? '' : '-8px';
      arrow.style.borderRight = below ? 'none' : ''; arrow.style.borderBottom = below ? 'none' : '';
      arrow.style.borderLeft = below ? '' : 'none'; arrow.style.borderTop = below ? '' : 'none';
    }
  });
}
ACT.startTour = () => startTour();

          (r === mine ? '<span class="badge" style="--tone:' + WF_ROLE[r].tone + ';margin-inline-start:auto">' + esc(t('wf_you')) + '</span>' : '') + '</div><ul>' +

(function boot() {
  applyTheme();
  applyLang();
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) { applyTheme(); redrawCharts(); } });
  const done = () => { const b = $('#boot'); b.classList.add('done'); setTimeout(() => b.remove(), 400); };
  const saved = session.get();
  if (saved && saved.token && saved.cfg && saved.cfg.user) {
    // إعادة تحميل الصفحة: نفتح فوراً بآخر بيانات معروفة، ثم نحدّث كل شيء بطلب واحد في الخلفية
    S.token = saved.token;
    restoreRC(saved.cfg.user.name);
    done();
    enterApp(saved.cfg);
    S.cfgAt = 0;
    setTimeout(() => sync(true), 30);
  } else if (saved && saved.token) {
    S.token = saved.token;
    call('getConfig').then(cfg => { done(); session.set({ token: saved.token, cfg: cfg }); enterApp(cfg); }).catch(() => { session.clear(); S.token = null; done(); showLogin(); });
  } else { done(); showLogin(); }
})();
