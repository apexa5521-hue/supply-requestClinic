/* عبر google.script.run (داخل Apps Script) كل استدعاء مباشر.

    body: JSON.stringify(body)

    google.script.run
      .withSuccessHandler(data => res({ ok: true, data: unpack(data) }))
      .withFailureHandler(e => {

/* الكتابة: «مشغول» تعني أن الخادم لم ينفّذ شيئاً (القفل لم يتوفر) → إعادة المحاولة آمنة */

function sendGroup(group) {
  const token = S.token;

      if (res.ok) return res.data;

/* كاش قراءة في المتصفح: عرض فوري لما فُتح مؤخراً + دمج القراءات المتطابقة المتزامنة.

    reports: [['getStatsReport', [Object.assign({ branch: '' }, mr)]]],
    monitor: [['getMonitor', [{ month: month }]]],

    complaints: [['getComplaints', [false]]]

/* تفاصيل أول الطلبات الظاهرة تُجلب مسبقاً في رحلة واحدة — فتح التفاصيل فوري حتى على الجوال (بلا تمرير مؤشر) */

  });

  call('batch', ids.map(id => ['getRequestDetail', [id]])).then(res => (res || []).forEach((r, i) => {
    if (r && r.ok) RC.set(rkey('getRequestDetail', [ids[i]]), { data: r.data, at: Date.now() });

/* عرض فوري لآخر نسخة معروفة ثم تحديث صامت: render(data, fromCache) — لا يُعاد الرسم إن لم تتغير البيانات */
function swr(fn, args, render, onErr) {
  const hit = peek(fn, args);
  let sig = '';
  if (hit !== undefined) { sig = JSON.stringify(hit); render(hit, true); }
  return call.apply(null, [fn].concat(args)).then(d => { const s2 = JSON.stringify(d); if (s2 !== sig) render(d, false); return d; })
    .catch(e => { if (hit === undefined && onErr) onErr(e); });
}
/* بيانات جاهزة مسبقاً (مع الدخول أو من آخر زيارة للتبويب) تُقدَّم فوراً مرة واحدة */
function seedRC(fn, args, data) {
  // بيانات جديدة من الخادم (مع الدخول): تُقدَّم لكل من يطلبها خلال 8 ثوانٍ
  RC.set(rkey(fn, args || []), { data: data, at: Date.now(), seedUntil: Date.now() + 8000 });
}
const PERSIST = ['getMyRequests', 'getRequests', 'getDoctorRequests', 'getAlerts', 'getNotices', 'getComplaints', 'getExecutiveStats', 'getQualityReport', 'getQualityTrend',
  'getStatsReport', 'getMonitor', 'getFinance', 'getLabCases', 'getMyLabCases', 'getDoctorLabCases', 'getLabStats', 'getLabConfig', 'getPriceList'];
let persistTimer = null;
/* حفظ الردود لآخر زيارة: كل مفتاح في خانة مستقلة، ويُكتب فقط ما تغيّر

    if (!S.user) return;
    try {
      const idx = JSON.parse(sessionStorage.getItem('sf_rc') || 'null');
      const keys = idx && idx.u === S.user.name && Array.isArray(idx.k) ? idx.k : [];
      RC_DIRTY.forEach(k => {
        const e = RC.get(k); if (!e) return;
        const str = JSON.stringify(e.data), sig = strSig(str);
        if (RC_SAVED[k] === sig) return;
        try { sessionStorage.setItem('sf_rc:' + k, str); RC_SAVED[k] = sig; if (keys.indexOf(k) === -1) keys.push(k); } catch (er) { /* مساحة ممتلئة: تجاهل */ }
      });
      RC_DIRTY.clear();

  }, 800);

    const o = JSON.parse(sessionStorage.getItem('sf_rc') || 'null');
    if (!o || o.u !== userName || !Array.isArray(o.k)) return 0;
    let n = 0;
    o.k.forEach(k => { const str = sessionStorage.getItem('sf_rc:' + k); if (str) { RC.set(k, { data: JSON.parse(str), at: 0, seed: true }); RC_SAVED[k] = strSig(str); n++; } });

  const kill = () => { el.classList.add('leaving'); setTimeout(() => el.remove(), 260); };

function stackTables(root) {
  $$('table.table', root || document).forEach(tb => {
    const heads = $$('thead th', tb).map(th => th.textContent.trim());
    if (!heads.length || tb.classList.contains('no-stack')) return;
    tb.classList.add('mstack');
    $$('tbody tr', tb).forEach(tr => { Array.from(tr.children).forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', heads[i] || ''); }); });
  });
}
(function () {
  let q = 0;

})();

    '<button class="chip" data-act="' + act + '" data-g="' + g.id + '" aria-pressed="' + (active === g.id) + '"' + (g.tone ? ' style="--tone:' + g.tone + '"' : '') + '>' +
      (g.tone ? '<i class="dot"></i>' : '') + esc(t(g.k)) + (counts ? '<span class="count-pill">' + (counts[g.id] || 0) + '</span>' : '') + '</button>').join('') + '</div>';
}
function groupCounts(groups, list) {
  const c = {};
  groups.forEach(g => { c[g.id] = list.filter(r => matchGroup(g, r)).length; });
  return c;
}
function matchGroup(g, r) { return g.test ? g.test(r) : (!g.statuses || g.statuses.indexOf(r.status) !== -1); }
function reqSearch(r, q) {
  if (!q) return true;
  return [r.id, r.clinic, r.branch, r.doctor, r.nurse, statusLabel(r.status), r.type].join(' ').toLowerCase().indexOf(q.toLowerCase()) !== -1;
}
function segmented(name, options, value, extraCls) {
  return '<div class="segmented ' + (extraCls || '') + '" data-seg="' + name + '">' +
    options.map(o => '<button type="button" data-act="seg" data-seg-name="' + name + '" data-v="' + esc(o.v) + '" aria-pressed="' + (o.v === value) + '">' + (o.icon ? icon(o.icon, 'i-sm') : '') + esc(o.label) + '</button>').join('') +
    '<span class="seg-thumb"></span></div>';
}
function placeThumb(seg) {
  const on = seg.querySelector('[aria-pressed="true"]');
  const th = seg.querySelector('.seg-thumb');
  if (!on || !th) return;
  const sr = seg.getBoundingClientRect(), br = on.getBoundingClientRect();
  const start = document.documentElement.dir === 'rtl' ? sr.right - br.right : br.left - sr.left;
  th.style.insetInlineStart = start + 'px';
  th.style.width = br.width + 'px';
}
const SEG_HANDLERS = {};
ACT.seg = el => {
  const seg = el.closest('.segmented');
  $$('button', seg).forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  placeThumb(seg);
  const h = SEG_HANDLERS[el.dataset.segName];
  if (h) h(el.dataset.v, seg);
};
window.addEventListener('resize', debounce(() => { $$('.segmented').forEach(placeThumb); redrawCharts(); }, 150));

function stepperHtml(r) {
  const cur = stMeta(r.status).step;
  const rejected = r.status === ST.REJECTED;
  const steps = [
    { k: 'step_submitted', ic: 'clipboard', at: r.submittedAt },
    { k: 'step_review', ic: 'steth', at: r.reviewAt },
    { k: 'step_approved', ic: rejected ? 'x' : 'check', at: rejected ? r.reviewedAt : (r.approvedAt || (r.status === ST.APPROVED ? r.reviewedAt : '')) },
    { k: 'step_prep', ic: 'package', at: r.prepAt },
    { k: 'step_sent', ic: 'truck', at: r.sentAt },
    { k: 'step_received', ic: 'pen', at: r.receivedAt }
  ];
  return '<div class="stepper">' + steps.map((s, i) => {
    let cls = 'todo';
    if (rejected && i === 2) cls = 'failed';
    else if (i < cur || (i === cur && (r.status === ST.RECEIVED))) cls = 'done';
    else if (i === cur) cls = 'current';
    if (s.at && cls === 'todo') cls = 'done';
    const lbl = rejected && i === 2 ? t('st_rejected') : t(s.k);
    return '<div class="step ' + cls + '"><span class="node">' + icon(cls === 'done' ? 'check' : s.ic) + '</span><span class="s-lbl">' + esc(lbl) + '</span><span class="s-time">' + (s.at ? esc(fmtDateTime(s.at)) : '&nbsp;') + '</span></div>';
  }).join('') + '</div>';
}
function kpiStepsHtml(kpi) {
  if (!kpi) return '';
  const u = kpi.unit === 'hours' ? t('unit_h') : t('unit_d');
  const late = kpi.unit === 'hours' ? 24 : 3;
  const rows = [
    ['k_review', kpi.reviewTime], ['k_prep_review', kpi.approvalToPrep], ['k_vendor', kpi.vendorWait],
    ['k_prep_sent', kpi.prepToSent], ['k_sent_recv', kpi.sentToReceived], ['k_total', kpi.totalCycle]
  ].filter(x => x[1] !== null && x[1] !== undefined);
  if (!rows.length) return '';
  return '<div><div class="section-title">' + icon('activity', 'i-sm') + esc(t('kpi_title')) + '</div><div class="kpi-steps">' +
    rows.map(x => '<div class="' + (x[0] !== 'k_total' && x[1] > late ? 'late' : '') + '"><b>' + fmtNum(x[1]) + '<small> ' + esc(u) + '</small></b><span>' + esc(t(x[0])) + '</span></div>').join('') + '</div></div>';
}
function commentsHtml(list) {
  if (!list || !list.length) return '<p class="muted" style="font-size:13px">' + esc(t('no_comments')) + '</p>';
  return list.map(c => '<div class="msg' + (c.author === S.user.name ? ' mine' : '') + '"><div class="bubble">' + esc(c.message || c.note) + '</div>' +
    '<div class="m-meta">' + esc(c.author) + ' · ' + esc(c.role) + ' · ' + esc(relTime(c.time)) + '</div></div>').join('');
}

function openComplaint(reqId) {
  const types = [['تأخير', 'c_delay'], ['نقص', 'c_short'], ['زيادة', 'c_excess'], ['أخرى', 'c_other']];
  const m = openModal({
    title: esc(t('complaint_title')), sub: esc(t('complaint_sub')), icon: 'alert', tone: 'warn', size: 'sm',
    body: '<div class="field"><label>' + esc(t('complaint_type')) + '</label><div class="chips" id="cTypes" style="flex-wrap:wrap">' +
      types.map((x, i) => '<button type="button" class="chip" data-v="' + x[0] + '" aria-pressed="' + (i === 0) + '">' + esc(t(x[1])) + '</button>').join('') + '</div></div>' +
      '<div class="field"><label for="cMsg">' + esc(t('complaint_details')) + '</label><textarea class="textarea" id="cMsg" maxlength="2000" placeholder="' + esc(t('complaint_ph')) + '"></textarea></div>' +
      '<div class="field-error hidden" id="cErr">' + icon('alert', 'i-sm') + '<span></span></div>',
    foot: '<span class="muted mono" style="font-size:13px">' + esc(reqId) + '</span><span class="spacer"></span><button class="btn" data-close>' + esc(t('cancel')) + '</button><button class="btn btn-primary" id="cSend">' + icon('send', 'i-sm flip') + esc(t('send')) + '</button>'
  });
  $('#cTypes', m.el).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    $$('.chip', m.el).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('#cSend', m.el).addEventListener('click', () => {
    const type = $('#cTypes [aria-pressed="true"]', m.el).dataset.v;
    const msg = $('#cMsg', m.el).value.trim();
    const err = $('#cErr', m.el);
    if (!msg) { err.querySelector('span').textContent = t('details_required'); err.classList.remove('hidden'); $('#cMsg', m.el).focus(); return; }
    const b = $('#cSend', m.el); busy(b, true, t('sending'));
    call('addComplaint', reqId, type, msg).then(() => { closeModal(m); toast(t('complaint_sent')); })
      .catch(e => { busy(b, false); err.querySelector('span').textContent = errMsg(e); err.classList.remove('hidden'); });
  });
}
ACT.complaint = el => openComplaint(el.dataset.id);

/** فترة رفع الطلب الشهري: من 15 إلى 20 (بتوقيت الرياض) */
const MONTHLY_WINDOW = [15, 20];
/* بعد يوم 20: الرفع متاح عادي لكنه يُعلَّم «رُفع متأخراً» — لا يُمنع أبداً */
function pastMonthlyWindow() {
  const d = Number(intl('d', 'day', 'en-US').format(new Date()));
  return d > MONTHLY_WINDOW[1];
}
/** الطبيب في بطاقة الطلب — أو «مستهلكات عيادة» للطلب بدون طبيب */
const LAB_SUPPLY = 'مستهلكات المعمل';
function docLabel(r) { return r.doctor || t(r.clinic === LAB_SUPPLY ? 'lab_supply_title' : 'kind_clinic'); }
const isLabUser = () => !!(S.user && S.user.screen === 'lab');
function nurseDraft() {
  if (!S.nurse.draft) {
    const saved = store.get('draft_' + S.user.name, null);
    S.nurse.draft = saved && Array.isArray(saved.items) ? saved : { kind: 'doctor', clinic: '', doctor: '', type: 'شهري', items: [] };
    if (S.nurse.draft.kind !== 'clinic' && S.nurse.draft.kind !== 'lab') S.nurse.draft.kind = 'doctor';
    if (isLabUser()) S.nurse.draft.kind = 'supply'; // مسؤول المعمل: طلب مستهلكات المعمل فقط
    if (!S.nurse.draft.key) S.nurse.draft.key = uid();
    if (saved && saved.items && saved.items.length) setTimeout(() => toast(t('draft_restored'), 'info'), 400);
  }
  return S.nurse.draft;
}
/* المسودة تُحفظ على الجهاز مع كل تعديل — لا تضيع إن انقطع الاتصال أو انتهت الجلسة أو أُغلقت الصفحة.
   key يميّز المسودة: إعادة إرسالها بعد انقطاع لا تنشئ طلباً مكرراً (الخادم يتعرف عليها) */
function saveDraft() {
  const d = S.nurse.draft; if (!d || !S.user) return;
  d.savedAt = Date.now();
  store.set('draft_' + S.user.name, d);
  renderDraftState();
}
function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* ignore */ }
  return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
function renderDraftState() {
  const box = $('#draftState'); const d = S.nurse.draft; if (!box || !d) return;
  const has = d.items.length > 0;
  box.classList.toggle('hidden', !has);
  const off = navigator.onLine === false || d.pending;
  if (has) box.innerHTML = icon(off ? 'clock' : 'checkc', 'i-sm') + '<span>' + esc(t(navigator.onLine === false ? 'draft_offline' : d.pending ? 'draft_pending' : 'draft_saved', { t: d.savedAt ? fmtTime(d.savedAt) : '' })) + '</span>';
  box.classList.toggle('offline', off);
}
ACT.saveDraftNow = () => { saveDraft(); toast(t('draft_saved_toast'), 'info', 2500); };

/* طلب الطبيب: الفرع الافتراضي = فرع عيادة الطبيب (إن عُرفت) */

  if (c && clinicDup(c.name) && S.clinics.some(x => x.name === c.name && x.branch === d.branch)) return; // الفرع الحالي من فروع العيادة

}
function loadDoctors() {

  sel.disabled = true;

    S.nurse.doctors = list || [];

    if (!d.doctorPicked && list.some(x => x.here) && !list.some(x => x.name === d.doctor && x.here)) d.doctor = list.find(x => x.here).name;

function catalogInfo(name) { return S.catalog.find(c => c.name.toLowerCase() === String(name).toLowerCase()); }
function addItem(name, qty, silent) {
  name = String(name).trim();
  if (!name) return;
  const d = nurseDraft();
  const ex = d.items.find(i => i.name.toLowerCase() === name.toLowerCase());
  if (ex) { ex.qty = Math.min(100000, ex.qty + (qty || 1)); ex._bump = true; }
  else { const c = catalogInfo(name); d.items.push({ name: c ? c.name : name, qty: qty || 1, _new: true }); }
  saveDraft();

/* الكمية: أقل شيء 1 — الصفر أو السالب أو الفارغ يُظهر خطأ واضحاً ويمنع الإرسال حتى يُصحَّح */
function qtyInvalid(inp) {

/* الأقسام: مستهلكات أسنان / جلدية — الطلب يأخذ قسم عيادته، والقائمة تعرض مستهلكات قسمه + المشتركة */
const deptOfText = v => /dent|أسنان|اسنان/i.test(v || '') ? 'أسنان' : /derm|جلد|skin/i.test(v || '') ? 'جلدية' : '';
function clinicDeptOf(name) { const c = (S.clinics || []).find(x => x.name === name); return c ? (deptOfText(c.type) || deptOfText(c.name)) : ''; }
function draftDept() {
  const d = nurseDraft();
  if (d.kind === 'clinic') return clinicDeptOf(d.clinic);
  if (d.docClinic) return clinicDeptOf(d.docClinic); // قسم الطلب من العيادة المختارة (كما في الخادم)
  const doc = (S.nurse.doctors || []).find(x => x.name === d.doctor);
  if (!doc) return '';
  const c = (S.clinics || []).find(x => String(doc.clinic).split(/[,،]/).map(v => v.trim()).indexOf(x.name) !== -1);
  return c ? clinicDeptOf(c.name) : deptOfText(doc.clinic);
}
function deptTag(dp, short) {

}
function setupCombo() {
  const inp = $('#itemSearch'), list = $('#comboList');
  let opts = [], active = -1;
  const close = () => { list.classList.add('hidden'); inp.setAttribute('aria-expanded', 'false'); active = -1; };
  const hl = (name, q) => {
    if (!q) return esc(name);
    const i = name.toLowerCase().indexOf(q.toLowerCase());
    return i === -1 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
  };
  const render = () => {
    const q = inp.value.trim();
    const ql = q.toLowerCase();
    const dept = draftDept();
    const matches = S.catalog.filter(c => !dept || !c.dept || c.dept === dept).filter(c => !ql || c.name.toLowerCase().indexOf(ql) !== -1 || (c.commercial || '').toLowerCase().indexOf(ql) !== -1 || (c.category || '').toLowerCase().indexOf(ql) !== -1)
      .sort((a, b) => (a.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1) - (b.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1) || a.name.localeCompare(b.name));
    // كل الأصناف تظهر (بالتمرير)، والبحث يصفّيها — بلا حد أعلى
    // الطلب من الكتالوج فقط — لا يمكن كتابة صنف جديد باسم حر
    opts = matches.map(c => ({ name: c.name, c: c }));
    const exact = q && S.catalog.some(c => c.name.toLowerCase() === ql);
    const freeOk = q && !exact && canFreeItem();
    active = opts.length ? 0 : -1;
    // صنف حر: يظهر تحت نتائج الكتالوج (لا يخفيها) عندما لا يطابق المكتوب اسم صنف بالضبط
    const fl = !freeOk ? '' : '<div class="combo-free"><div class="combo-head">' + esc(t('free_head')) + '</div>' +
      ['مستهلك', 'ماتيريال'].map(ty => '<button type="button" class="combo-opt combo-free-opt" data-free="' + esc(ty) + '" data-q="' + esc(q) + '">' + icon('plus', 'i-sm') + '<div class="grow"><div class="nm">' + esc(t(ty === 'مستهلك' ? 'free_opt_cons' : 'free_opt_mat', { n: q })) + '</div></div></button>').join('') + '</div>';
    if (!opts.length && fl) {
      list.innerHTML = fl;
    } else if (!opts.length) {

  };

    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(active - 1, 0)); }

/*
 * إرسال المسودة. عند تعذّر الإرسال (انقطاع/خادم مشغول) تُعلَّم «بانتظار الإرسال» ويُعاد إرسالها تلقائياً
 * كل 20 ثانية (وفور عودة الاتصال، وبعد إعادة فتح الصفحة) — مفتاح المسودة يمنع أي تكرار.
 */
const AUTO_SEND = { timer: 0, tries: 0, delay: 20000 };
function sendDraft(el, auto) {
  const d = nurseDraft();
  const err = $('#submitErr');
  if (!d.items.length || AUTO_SEND.sending) return;
  clearTimeout(AUTO_SEND.timer);
  if (navigator.onLine === false) { markPending(d, err, 'offline_kept'); return; }
  AUTO_SEND.sending = true;
  if (el) busy(el, true, t('sending'));
  const byClinic = d.kind === 'clinic';
  call('createRequest', { clinic: byClinic ? d.clinic : d.docClinic || '', branch: isLabUser() ? '' : d.branch || '', doctor: byClinic ? '' : d.doctor, type: d.type, items: d.items.map(i => ({ name: i.name, qty: Number(i.qty), free: !catalogInfo(i.name) && !!i.free, type: i.type || '' })), clientKey: d.key, backdate: bdOn(d) ? d.bdDate || '' : '' })
    .then(res => {
      AUTO_SEND.sending = false; AUTO_SEND.tries = 0;
      if (el) busy(el, false);
      // duplicate = هذه المسودة وصلت الخادم سابقاً (مثلاً انقطع الاتصال قبل وصول الرد) — لا طلب مكرر
      if (res && res.duplicate) toast(t('duplicate_request', { id: res.id }), 'info', 5000);
      else toast(t(res && res.backdated ? 'bd_sent' : 'request_sent', { id: res.id }), 'success', 5000);
      d.items = []; d.key = uid(); d.pending = false; saveDraft();
      if (err) err.classList.add('hidden');
      if (S.view === 'new') renderItems();
      S.loaded.mine = false;
      loadMine(true);
    })
    .catch(e => {
      AUTO_SEND.sending = false;
      if (el) busy(el, false);
      if (errCode(e) === 'ERR_SESSION') { d.pending = true; saveDraft(); return; } // بعد الدخول تُرسل تلقائياً
      const lost = ['ERR_NETWORK', 'ERR_BAD_RESPONSE', 'ERR_BUSY', 'ERR_TIMEOUT'].indexOf(errCode(e)) !== -1;
      if (lost) { markPending(d, err, 'send_auto_retry'); return; }
      d.pending = false; saveDraft();
      if (err) { err.querySelector('span').textContent = errMsg(e); err.classList.remove('hidden'); }
      else toast(errMsg(e), 'error', 6000);
    });
}
function markPending(d, err, k) {
  d.pending = true; saveDraft();
  AUTO_SEND.tries++;
  const box = err || $('#submitErr');
  if (box) { box.querySelector('span').textContent = t(k); box.classList.remove('hidden'); }
  if (AUTO_SEND.tries === 1 && !box) toast(t(k), 'warning', 5000);
  clearTimeout(AUTO_SEND.timer);
  AUTO_SEND.timer = setTimeout(() => { if (S.user && S.nurse.draft && S.nurse.draft.pending) sendDraft($('#submitBtn'), true); }, Math.min(AUTO_SEND.delay * AUTO_SEND.tries, 120000));
}
/* عند عودة الاتصال أو بعد الدخول: مسودة «بانتظار الإرسال» تُرسل وحدها */
function resumePendingSend() {
  if (!S.user || (S.user.screen !== 'nurse' && S.user.screen !== 'lab')) return;
  const d = nurseDraft();
  if (d.pending && d.items.length && !AUTO_SEND.sending) { toast(t('send_resuming'), 'info', 3000); sendDraft($('#submitBtn'), true); }
}

function signaturePad(canvas, wrap) {
  let ctx, drawing = false, ink = false, last = null;
  const setup = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14201c'; ctx.lineWidth = 2.4;
    ink = false; wrap.classList.remove('inked');
  };
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(last.x, last.y); e.preventDefault(); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    const mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
    ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(mid.x, mid.y);
    last = p;
    if (!ink) { ink = true; wrap.classList.add('inked'); }
    e.preventDefault();
  });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);
  requestAnimationFrame(setup);
  return { clear: setup, hasInk: () => ink, toDataURL: () => canvas.toDataURL('image/png'), canvas: canvas };
}
/* صورة إيصال: قسم لكل شحنة (أصنافها + المستلم + التوقيع). combined = الإيصال الموحّد للطلب المكتمل */
function drawReceipt(id, sections, combined) {
  try {
    const rowH = 28, W = 680, sigH = 90;
    const secH = s => 34 + rowH + s.items.length * rowH + 30 + sigH + 40;
    const H = 96 + sections.reduce((h, s) => h + secH(s), 0) + 16;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const when = v => { const d = toDate(v) || new Date(); return intl('d', 'stamp', 'en-GB').format(d); };
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#3d8fc8'; x.fillRect(0, 0, W, 10);
    // client company logo (from #companyLogo in Index.html), top-left of the receipt
    const lg = $('#companyLogo');
    if (lg && lg.getAttribute('src') && lg.complete && lg.naturalWidth) x.drawImage(lg, 20, 18, 120, Math.round(120 * lg.naturalHeight / lg.naturalWidth));
    x.textAlign = 'center'; x.fillStyle = '#3d8fc8'; x.font = 'bold 21px Arial, sans-serif';
    x.fillText('Supply Flow (مسار) · ' + (combined ? 'Combined receipt' : 'Receipt'), W / 2, 44);
    x.fillStyle = '#555'; x.font = '13px Arial, sans-serif';
    x.fillText(id + '   |   ' + when() + (combined ? '   |   ' + sections.length + ' shipment(s)' : ''), W / 2, 68);
    let y = 92;
    sections.forEach(s => {
      x.fillStyle = '#3d8fc8'; x.font = 'bold 15px Arial, sans-serif'; x.textAlign = 'left';
      x.fillText('Shipment #' + s.batch, 20, y + 20);
      x.fillStyle = '#777'; x.font = '12px Arial, sans-serif'; x.textAlign = 'right';
      x.fillText('Received ' + when(s.at), W - 20, y + 20);
      y += 34;
      x.fillStyle = '#e8f4f0'; x.fillRect(20, y, W - 40, rowH);
      x.fillStyle = '#3d8fc8'; x.font = 'bold 13px Arial, sans-serif';
      x.textAlign = 'left'; x.fillText('Item', 30, y + 19);
      x.textAlign = 'center'; x.fillText('Sent', W - 170, y + 19); x.fillText('Received', W - 70, y + 19);
      y += rowH;
      s.items.forEach((it, i) => {
        x.fillStyle = i % 2 ? '#fff' : '#fafafa'; x.fillRect(20, y, W - 40, rowH);
        x.strokeStyle = '#e5e9e7'; x.strokeRect(20, y, W - 40, rowH);
        x.fillStyle = '#222'; x.font = '13px Arial, sans-serif';
        x.textAlign = 'left'; x.direction = /[؀-ۿ]/.test(it.item) ? 'rtl' : 'ltr';
        if (x.direction === 'rtl') { x.textAlign = 'right'; x.fillText(String(it.item), W - 230, y + 19, 400); } else x.fillText(String(it.item), 30, y + 19, 440);
        x.direction = 'ltr'; x.textAlign = 'center';
        x.fillText(String(it.sent), W - 170, y + 19);
        x.fillStyle = it.got !== '' && Number(it.got) < Number(it.sent) ? '#c93a3a' : '#222';
        x.fillText(String(it.got === '' ? '—' : it.got), W - 70, y + 19);
        y += rowH;
      });
      y += 22;
      x.fillStyle = '#333'; x.font = 'bold 13px Arial, sans-serif'; x.textAlign = 'left';
      x.fillText('Receiver: ', 30, y);
      x.font = '13px Arial, sans-serif'; x.fillText(String(s.receiver || '—'), 100, y);
      y += 8;
      x.strokeStyle = '#d8dfdb'; x.strokeRect(30, y, 240, sigH);
      if (s.sig) x.drawImage(s.sig, 30, y, 240, sigH);
      x.fillStyle = '#888'; x.font = '11px Arial, sans-serif'; x.fillText(s.sig ? 'Signature' : 'No signature', 30, y + sigH + 16);
      y += sigH + 32;
      if (combined) { x.strokeStyle = '#e5e9e7'; x.beginPath(); x.moveTo(20, y - 8); x.lineTo(W - 20, y - 8); x.stroke(); }
    });
    x.fillStyle = '#3d8fc8'; x.fillRect(0, H - 8, W, 8);
    return c.toDataURL('image/png');
  } catch (e) { console.error(e); return ''; }
}

function runBulk(target, rows, boxes) {
  const ids = rows.map(r => r.id);
  // تحديث فوري للقائمة (نفس قواعد الخادم في CAN_MOVE)؛ الخادم يؤكد في الخلفية
  const prev = rows.map(r => [r, r.status]);
  rows.forEach(r => { r.status = target; S.proc.selected.delete(r.id); });
  renderProcList(false);
  toast(t('bulk_done', { n: ids.length }));
  call('bulkUpdateStatus', ids, target, boxes || {}).then(res => {
    if (boxes) BX.data = null;
    const sk = res.skipped || [];
    if (sk.length) {
      prev.forEach(([r, st]) => { if (sk.some(x => x.id === r.id)) r.status = st; });
      renderProcList(false);
      openModal({
        title: esc(t('bulk_skipped_title')), sub: esc(t('bulk_skipped_sub', { a: (res.updated || []).length, b: sk.length })), icon: 'alert', tone: 'warn',
        body: '<div class="table-wrap"><table class="table"><tbody>' + sk.map(s => '<tr><td class="mono" style="font-weight:700">' + esc(s.id) + '</td><td>' + (s.from ? badge(s.from) : '') + '</td><td>' + esc(t(s.reason)) + '</td></tr>').join('') + '</tbody></table></div>',
        foot: '<span class="spacer"></span><button class="btn btn-primary" data-close>' + esc(t('close')) + '</button>'
      });
    }
    loadProc(true); loadAlerts();
  }).catch(e => {
    prev.forEach(([r, st]) => { r.status = st; });
    renderProcList(false);
    toast(t('save_failed', { id: ids.join('، ') }) + ' — ' + errMsg(e), 'error', 6000);
    loadProc(true);
  });
}

function printReport(html) {
  let area = document.getElementById('printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = html;
  const theme = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = 'light'; // الورق أبيض دائماً
  document.body.classList.add('printing');
  let finished = false;
  const done = () => {
    if (finished) return; finished = true;
    document.body.classList.remove('printing'); area.innerHTML = '';
    document.documentElement.dataset.theme = theme;
    window.removeEventListener('afterprint', done);

function countUp(root, instant) {
  $$('[data-count]', root).forEach(el => {
    const to = Number(el.dataset.count) || 0;
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix ? '<small>' + esc(el.dataset.suffix) + '</small>' : '';
    if (REDUCED || instant || to === 0) { el.innerHTML = fmtNum(to, dec) + suffix; return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.max(0, Math.min(1, (now - t0) / dur));
      const e = 1 - Math.pow(1 - p, 3);
      el.innerHTML = fmtNum(to * e, dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* ---------- Canvas charts (DPR aware, animated, themed, hover tooltips) ---------- */
const CHARTS = {};
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function redrawCharts() { Object.keys(CHARTS).forEach(k => drawChart(CHARTS[k], false)); }
function drawChart(cfg, animate) {
  const canvas = document.getElementById(cfg.canvas);
  if (!canvas) return;
  const box = canvas.parentElement;
  const W = box.clientWidth, H = box.clientHeight;
  if (!W) return;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  const rtl = document.documentElement.dir === 'rtl';
  // قراءة متغيرات CSS مرة واحدة لكل رسم (getComputedStyle مكلف ويُستدعى في كل إطار للحركة)
  const cs = getComputedStyle(document.documentElement), cv = n => cs.getPropertyValue(n).trim();
  const colors = { grid: cv('--border'), text: cv('--muted'), main: cv('--primary'), line: cv('--t-blue'), surface: cv('--surface'), strong: cv('--primary-strong'), ink: cv('--text') };
  const fontFam = cv('--font').split(',')[0];
  const data = cfg.data, labels = cfg.labels;
  const pad = { t: 22, r: 16, b: cfg.type === 'bar' ? 44 : 28, l: 40 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const L = rtl ? pad.r : pad.l, R = rtl ? W - pad.l : W - pad.r;
  const rawMax = Math.max.apply(null, data.concat([1]));
  const niceMax = (function (v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })(rawMax);
  const X = i => {
    const off = cfg.type === 'bar' ? (i + 0.5) * pw / data.length : (data.length > 1 ? i * pw / (data.length - 1) : pw / 2);
    return rtl ? R - off : L + off;
  };
  const Y = v => pad.t + ph - (v / niceMax) * ph;
  const font = s => s + 'px ' + fontFam;
  const points = data.map((v, i) => ({ x: X(i), y: Y(v), v: v, i: i }));
  cfg._points = points; cfg._barW = Math.min(pw / Math.max(data.length, 1) * 0.56, 46);

  function frame(p) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1; ctx.strokeStyle = colors.grid; ctx.fillStyle = colors.text; ctx.font = font(11);
    ctx.textAlign = rtl ? 'left' : 'right'; ctx.textBaseline = 'middle';
    for (let g = 0; g <= 4; g++) {
      const v = niceMax * g / 4, y = Y(v);
      ctx.beginPath(); ctx.setLineDash(g ? [3, 4] : []); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
      ctx.fillText(fmtNum(v, 0), rtl ? R + 8 : L - 8, y);
    }
    ctx.setLineDash([]);
    if (!data.length || data.every(v => !v)) {
      ctx.textAlign = 'center'; ctx.fillStyle = colors.text; ctx.font = font(13);
      ctx.textBaseline = 'middle'; ctx.fillText(t('no_data'), (L + R) / 2, pad.t + ph / 2);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = colors.text; ctx.font = font(11);
    labels.forEach((l, i) => {
      const x = points[i].x;
      const raw = String(l).replace(/^(عيادة|Clinic)\s+/, '');
      const max = Math.max(6, Math.floor((cfg.type === 'bar' ? pw / Math.max(data.length, 1) : 80) / 7));
      const txt = raw.length > max ? raw.slice(0, max - 1) + '…' : raw;
      ctx.fillText(txt, x, H - pad.b + 8);
    });
    if (cfg.type === 'line') {
      const col = colors.line;
      const n = points.length;
      if (n) {
        const upto = p * (n - 1);
        ctx.beginPath();
        const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ph);
        grad.addColorStop(0, hexA(col, .28)); grad.addColorStop(1, hexA(col, 0));
        ctx.moveTo(points[0].x, Y(0));
        let lastX = points[0].x;
        for (let i = 0; i < n; i++) {
          if (i > upto + 1e-6) {
            const f = upto - Math.floor(upto), a = points[i - 1], b = points[i];
            const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
            ctx.lineTo(x, y); lastX = x; break;
          }
          ctx.lineTo(points[i].x, points[i].y); lastX = points[i].x;
        }
        ctx.lineTo(lastX, Y(0)); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          if (i > upto + 1e-6) {
            const f = upto - Math.floor(upto), a = points[i - 1], b = points[i];
            ctx.lineTo(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f); break;
          }
          if (i) ctx.lineTo(points[i].x, points[i].y); else ctx.moveTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
        points.forEach((pt, i) => {
          if (i > upto + 1e-6) return;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, cfg._hover === i ? 6 : 4, 0, Math.PI * 2);
          ctx.fillStyle = colors.surface; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
        });
      }
    } else {
      const bw = cfg._barW;
      points.forEach((pt, i) => {
        const h = (Y(0) - pt.y) * p;
        const x = pt.x - bw / 2, y = Y(0) - h;
        const r = Math.min(7, bw / 2, h);
        ctx.beginPath();
        ctx.moveTo(x, Y(0)); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.lineTo(x + bw - r, y); ctx.quadraticCurveTo(x + bw, y, x + bw, y + r); ctx.lineTo(x + bw, Y(0)); ctx.closePath();
        ctx.fillStyle = cfg._hover === i ? colors.strong : colors.main; ctx.fill();
        if (p === 1 && pt.v) { ctx.fillStyle = colors.ink; ctx.font = font(11); ctx.textBaseline = 'bottom'; ctx.fillText(fmtNum(pt.v), pt.x, y - 4); }
      });
    }
  }
  cfg._frame = frame;
  // رسم جديد يلغي حركة سابقة على نفس اللوحة (وإلا تتراكم حلقات الحركة مع كل تحديث)
  if (canvas._raf) { cancelAnimationFrame(canvas._raf); canvas._raf = 0; }
  if (animate && !REDUCED) {
    const t0 = performance.now();
    const tick = now => { const p = Math.max(0, Math.min(1, (now - t0) / 900)); frame(1 - Math.pow(1 - p, 3)); canvas._raf = p < 1 ? requestAnimationFrame(tick) : 0; };
    canvas._raf = requestAnimationFrame(tick);
  } else frame(1);
  if (!canvas._hooked) {
    canvas._hooked = true;
    canvas.addEventListener('mousemove', e => chartHover(cfg, e));
    canvas.addEventListener('mouseleave', () => { cfg._hover = null; cfg._frame(1); document.getElementById(cfg.tip).classList.remove('show'); });
  }
}
function chartHover(cfg, e) {
  const c = CHARTS[cfg.canvas === 'trendChart' ? 'trend' : 'clinic'] || cfg;
  if (!c._points || !c._points.length) return;
  const r = e.target.getBoundingClientRect();
  const mx = e.clientX - r.left;
  let best = 0, bd = Infinity;
  c._points.forEach((p, i) => { const d = Math.abs(p.x - mx); if (d < bd) { bd = d; best = i; } });
  if (c._hover !== best) { c._hover = best; c._frame(1); }
  const p = c._points[best];
  const tip = document.getElementById(c.tip);
  tip.innerHTML = esc(c.labels[best]) + ' · ' + fmtNum(p.v) + ' ' + esc(c.unit !== undefined ? c.unit : t('hours_short')) + (c.extra ? ' · ' + c.extra[best] + ' ' + esc(t('count')) : '');
  tip.style.left = p.x + 'px'; tip.style.top = p.y + 'px';
  tip.classList.add('show');
}
function hexA(hex, a) {
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
}

    [s.requests, s.requested, s.approved, s.reviewSaving, s.dispatched, s.received].map(q).join(',')];
  const block = (title, rows) => {
    lines.push('', q(title), [title, t('rep_requests'), t('rp_value'), t('rp_avg_request')].map(q).join(','));

  };

  const dt = new Date(scan + 'T12:00:00'); dt.setDate(dt.getDate() + days);

/* الصور: تُصغَّر على الجهاز (JPEG ‏1280px) قبل الإرسال */
function fileToJpeg(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ERR_BAD_IMAGE')); };
    img.src = url;
  });
}

ACT.labSubmit = el => {

  if (itero) {
    if (!d.doctor || !d.fileNo.trim() || !d.scanDate || !d.iteroNo.trim()) return fail('lab_err_fill');
    if (d.scanDate > todayStr()) return fail('lab_scan_future');
  } else if (redo) {
    if (!d.redoOf) return fail('lab_err_pick');
    if (!d.redoItems.length) return fail('lab_err_lines');
    if (!d.redoReason) return fail('lab_err_reason');
    if (!d.redoNote.trim()) return fail('lab_err_note');
    if (!d.redoScanDate) return fail('lab_err_scan');
    if (d.redoScanDate > todayStr()) return fail('lab_scan_future');
  } else {
    if (!d.doctor || !d.fileNo.trim() || !d.scanDate) return fail('lab_err_fill');
    if (d.scanDate > todayStr()) return fail('lab_scan_future');
    if (!d.lines.some(l => l.lab && l.workType) || d.lines.some(l => (l.lab || l.workType || l.details) && !(l.lab && l.workType))) return fail('lab_err_lines_fill');
  }

    ? { itero: d.iteroNo.trim(), lab: d.iteroLab || '', doctor: d.doctor, fileNo: d.fileNo.trim(), branch: d.branch, scanDate: d.scanDate, clientKey: d.key }
    : redo
    ? { redoOf: d.redoOf, redoItems: d.redoItems, redoReason: d.redoReason, redoNote: d.redoNote, redoScanDate: d.redoScanDate, redoLab: d.redoLab, photos: d.photos, clientKey: d.key }
    : { doctor: d.doctor, fileNo: d.fileNo.trim(), branch: d.branch, scanDate: d.scanDate, urgent: !!d.urgent, delivered: !!d.delivered, notes: d.notes,
        lines: d.lines.filter(l => l.lab && l.workType).map(l => ({ lab: l.lab, workType: l.workType, details: l.details, photos: l.photos || [] })), clientKey: d.key };

function asIssueModal(clinic, preset) {
  const items = (AS.cfg && AS.cfg.items) || [];
  preset = preset || {};
  const m = openModal({ title: esc(t('as_issue_title')), sub: esc(clinic + (preset.ticketId ? ' · ' + t('ta_replace') + ' ' + preset.ticketId : '')), icon: 'package',
    body: '<div class="field"><label for="isItem">' + esc(t('as_item')) + '</label><select class="select" id="isItem"' + (preset.item ? ' disabled' : '') + '>' +
        items.map(i => '<option' + (i.name === preset.item ? ' selected' : '') + '>' + esc(i.name) + '</option>').join('') + '</select></div>' +
      '<div class="field" id="isQtyW"><label for="isQty">' + esc(t('as_qty')) + '</label><input class="input" id="isQty" type="number" min="1" max="500" value="1" inputmode="numeric"></div>' +
      '<div class="field hidden" id="isSerW"><div class="between"><span class="label">' + esc(t('as_serials')) + '</span><span class="hint" id="isSerN"></span></div><div class="hint">' + esc(t('as_serials_hint')) + '</div>' +
        '<div class="as-ser-rows" id="isSer"></div><button type="button" class="btn btn-soft btn-sm" id="isSerAdd" style="align-self:flex-start">' + icon('plus', 'i-sm') + esc(t('as_serial_add')) + '</button></div>' +
      '<div class="field"><label for="isCost">' + esc(t('as_cost')) + '</label><input class="input" id="isCost" inputmode="decimal"></div>' +
      '<div class="field"><label for="isNote">' + esc(t('as_notes')) + '</label><input class="input" id="isNote" maxlength="300"></div>' +
      '<div class="field-error hidden" id="isErr">' + icon('alert', 'i-sm') + '<span></span></div>',
    foot: '<span class="spacer"></span><button class="btn" data-close>' + esc(t('cancel')) + '</button>' +
      (preset.ticketId ? '' : '<button class="btn btn-soft" id="isMore">' + icon('plus', 'i-sm') + esc(t('as_issue_more')) + '</button>') +
      '<button class="btn btn-primary" id="isOk">' + icon('check', 'i-sm') + esc(t('as_issue')) + '</button>' });
  const rows = $('#isSer', m.el);
  const serials = () => $$('.as-ser-row .input', rows).map(x => x.value.trim()).filter(Boolean);
  const count = () => { const n = serials().length; $('#isSerN', m.el).textContent = n ? t('as_units_n', { n: n }) : ''; };
  // سطر لكل قطعة: Enter ينتقل للسطر التالي (أو ينشئه)، ولصق عدة أرقام يوزّعها على أسطر
  const addRow = (val, after) => {
    const r = document.createElement('div'); r.className = 'as-ser-row';
    r.innerHTML = '<input class="input mono" dir="ltr" maxlength="60" autocomplete="off" placeholder="' + esc(t('as_serial_ph')) + '"><button type="button" class="btn btn-ghost btn-icon btn-sm" aria-label="' + esc(t('remove')) + '">' + icon('x', 'i-sm') + '</button>';
    const inp = r.firstChild; inp.value = val || '';
    inp.addEventListener('input', count);
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const next = r.nextElementSibling;
      if (next) next.firstChild.focus(); else if (inp.value.trim()) addRow('', r).focus();
    });
    inp.addEventListener('paste', e => {
      const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
      const parts = txt.split(/[\n\r\t,،;]+/).map(x => x.trim()).filter(Boolean);
      if (parts.length < 2) return;
      e.preventDefault();
      inp.value = parts[0]; let last = r;
      parts.slice(1).forEach(v => { const ni = addRow(v, last); last = ni.parentNode; });
      count();
    });
    r.lastChild.addEventListener('click', () => { if (rows.children.length > 1) r.remove(); else inp.value = ''; count(); });
    if (after && after.nextSibling) rows.insertBefore(r, after.nextSibling); else rows.appendChild(r);
    return inp;
  };
  addRow();
  $('#isSerAdd', m.el).addEventListener('click', () => addRow().focus());
  const sync = () => {
    const it = items.find(i => i.name === $('#isItem', m.el).value) || {};
    $('#isSerW', m.el).classList.toggle('hidden', !it.serialized); $('#isQtyW', m.el).classList.toggle('hidden', !!it.serialized);
  };
  $('#isItem', m.el).addEventListener('change', sync); sync();
  const save = (b, more) => {
    busy(b, true);
    const err = $('#isErr', m.el); err.classList.add('hidden');
    call('issueAssets', { clinic: clinic, item: $('#isItem', m.el).value, qty: Number($('#isQty', m.el).value), serials: serials(),
      cost: $('#isCost', m.el).value.trim(), notes: $('#isNote', m.el).value.trim(), ticketId: preset.ticketId || '' }).then(res => {
      busy(b, false); toast(t('as_issued', { n: res.ids.length }), 'success');
      if (!more) closeModal(m);
      // تحديث بطاقة العيادة لا يمنع إغلاق النافذة لو تأخر أو فشل
      try { const k = AS.clinics.findIndex(x => x.clinic === clinic); if (k !== -1 && res.clinic) AS.clinics[k] = res.clinic; asRenderClinics(); } catch (e2) { console.error(e2); }
      if (preset.onDone) preset.onDone();
      if (!more) return;
      rows.innerHTML = ''; addRow(); count();
      $('#isQty', m.el).value = 1; $('#isNote', m.el).value = '';
      const f = $('#isSerW', m.el).classList.contains('hidden') ? $('#isItem', m.el) : rows.querySelector('.input');
      if (f) f.focus();
    }).catch(er => { busy(b, false); err.querySelector('span').textContent = errMsg(er); err.classList.remove('hidden'); });
  };
  $('#isOk', m.el).addEventListener('click', e => save(e.currentTarget, false));
  if ($('#isMore', m.el)) $('#isMore', m.el).addEventListener('click', e => save(e.currentTarget, true));
}

function asTicketAction(tk, a) {

  $('#taOk', m.el).addEventListener('click', e => {

    const err = $('#taErr', m.el);

    const b = e.currentTarget; busy(b, true);

    p.then(() => { busy(b, false); closeModal(m); toast(t('tk_saved'), 'success'); openAssetTicket(tk.id, true); if (S.view === 'assets') asLoad(true); loadAlerts(); })
      .catch(er => { busy(b, false); err.querySelector('span').textContent = errMsg(er); err.classList.remove('hidden'); });
  });
}

ACT.labKpiCsv = () => {
  const st = LAB.stats; if (!st) return;
  const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const lines = [[t('nav_lab_kpi'), periodLabel(LAB.statsRange)].map(q).join(',')];
  const block = (title, rows) => {
    const head = [title, t('lab_k_items'), t('lab_k_avg'), t('lab_k_ontime'), t('lab_k_redo'), t('lab_k_overdue'), t('lab_k_cost')], keep = csvKeep(head);
    lines.push('', q(title), keep(head).map(q).join(','));
    rows.forEach(r => lines.push(keep([r.name + (r.type ? ' (' + r.type + ')' : ''), r.items, r.avgDays, r.onTimeRate, r.redo, r.overdue, r.cost]).map(q).join(',')));
  };
  block(t('lab_by_lab'), st.labs); block(t('lab_by_type'), st.workTypes); block(t('lab_kind'), st.kinds);
  lines.push('', q(t('lab_reasons'))); st.reasons.forEach(r => lines.push([r.reason, r.count].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lab-kpis.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

    const b = e.currentTarget; busy(b, true);
    call('saveRole', name, sc, perms).then(roles => { S.roles = roles; closeModal(m); renderRoles(); renderUsers(); toast(t('role_saved')); })
      .catch(err => { busy(b, false); showErr(errMsg(err)); });
  });
  if (editing) $('#rDel', m.el).addEventListener('click', e => {
    confirmDialog(t('confirm_delete_role', { n: r.name }), { danger: true, ok: t('delete'), icon: 'trash' }).then(ok => {

    });
  });
}

function mgmtTourSteps() {
  const extra = [
    { sel: NAV_SEL('monitor'), t: 't_monitor_t', b: 't_monitor_b', icon: 'clock' },
    { sel: NAV_SEL('finance'), t: 't_finance_t', b: 't_finance_b', icon: 'cart' },
    { sel: NAV_SEL('users'), t: 't_users_t', b: 't_users_b', icon: 'users' }
  ];
  const ids = navItems().map(n => n.id);
  const steps = TOUR_STEPS.dashboard.concat(extra).filter(st => {
    const v = st.view || ((st.sel.match(/data-view="([^"]+)"/) || [])[1]);
    return !v || ids.indexOf(v) !== -1;
  });
  if (steps.length && !/data-view/.test(steps[0].sel)) steps.unshift({ sel: NAV_SEL(ids[0]), t: 't_nav_t', b: 't_nav_b', icon: 'menu' });
  return steps;
}

      '<button class="btn btn-primary btn-sm" data-tour="next">' + esc(TOUR.i === 0 ? t('tour_start') : (last ? t('tour_done') : t('tour_next'))) + '</button>' +
    '</div>' + (center ? '' : '<span class="t-arrow"></span>');

function tourReposition() {
  if (!TOUR.active) return;
  cancelAnimationFrame(TOUR.raf);
  TOUR.raf = requestAnimationFrame(() => {
    const els = TOUR.els, el = TOUR.target;
    if (!el || !document.contains(el)) {
      els.spot.classList.add('center');
      els.spot.removeAttribute('style');
      if (el) { TOUR.target = null; renderTourCard(TOUR.steps[TOUR.i]); }
      return;
    }
    els.spot.classList.remove('center');
    const r = el.getBoundingClientRect(), pad = 6, vw = window.innerWidth, vh = window.innerHeight;
    const top = Math.max(r.top - pad, 4), left = Math.max(r.left - pad, 4);
    const w = Math.min(r.width + pad * 2, vw - left - 4), h = Math.min(r.bottom + pad, vh - 4) - top;
    Object.assign(els.spot.style, { top: top + 'px', left: left + 'px', width: w + 'px', height: Math.max(h, 24) + 'px' });
    const card = els.card, cw = card.offsetWidth, ch = card.offsetHeight, gap = 14, m = 12;
    let ct, below = true;
    if (r.bottom + gap + ch <= vh - m) ct = r.bottom + gap;
    else if (r.top - gap - ch >= m) { ct = r.top - gap - ch; below = false; }
    else ct = vh - ch - m;
    let cl = r.left + r.width / 2 - cw / 2;
    cl = Math.min(Math.max(cl, m), vw - cw - m);
    card.style.top = ct + 'px';
    card.style.left = cl + 'px';
    const arrow = card.querySelector('.t-arrow');
    if (arrow) {
      const cr = card.getBoundingClientRect();
      const ax = Math.min(Math.max(r.left + r.width / 2 - cr.left - 7, 16), cr.width - 30);
      const overlapping = ct < r.bottom && ct + ch > r.top;
      arrow.style.display = overlapping ? 'none' : '';
      arrow.style.left = ax + 'px';
      arrow.style.top = below ? '-8px' : '';
      arrow.style.bottom = below ? '' : '-8px';
      arrow.style.borderRight = below ? 'none' : ''; arrow.style.borderBottom = below ? 'none' : '';
      arrow.style.borderLeft = below ? '' : 'none'; arrow.style.borderTop = below ? '' : 'none';
    }
  });
}

function loadQr() {
  if (window.QRCode) return Promise.resolve(window.QRCode);
  return QR_LIB || (QR_LIB = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = () => (window.QRCode ? res(window.QRCode) : rej(new Error('ERR_NETWORK')));
    sc.onerror = () => { QR_LIB = null; rej(new Error('ERR_NETWORK')); };
    document.head.appendChild(sc);
  }));
}
function qrDataUrl(text) {
  const d = document.createElement('div');
  new window.QRCode(d, { text: text, width: 320, height: 320, correctLevel: window.QRCode.CorrectLevel.M });
  const c = d.querySelector('canvas');
  return c ? c.toDataURL('image/png') : ((d.querySelector('img') || {}).src || '');
}
function printStickers(list) {
  if (!list.length) return;
  loadQr().then(() => list.map(b => ({ b: b, src: qrDataUrl(boxLink(b)) })), () => { toast(t('bx_qr_offline'), 'warning', 6000); return list.map(b => ({ b: b, src: '' })); })
    .then(items => printReport('<div class="stickers">' + items.map(x =>
      '<div class="sticker">' + (x.src ? '<img src="' + x.src + '" alt="">' : '<div class="qr-fallback mono" dir="ltr">' + esc(boxLink(x.b)) + '</div>') +
      '<div class="st-id mono">' + esc(x.b.id) + '</div><div class="st-owner">' + esc(x.b.owner + (x.b.branch ? ' · ' + x.b.branch : '')) + '</div><div class="st-hint">' + esc(t('bx_scan')) + '</div></div>').join('') + '</div>'));
}
ACT.bxSticker = el => printStickers((BX.data.boxes || []).filter(b => b.id === el.dataset.id));
ACT.bxPrintAll = () => printStickers((BX.data && BX.data.boxes) || []);

/* ---------- صفحة السواق: يمسح الـ QR ← مكان التسليم + صورة + اسمه ← «تسليم» ---------- */
const DRV = { photo: '', key: '', to: '', tk: '', render: null };
function getUrlParams() {
  return new Promise(res => {
    try {
      if (window.google && google.script && google.script.url && google.script.url.getLocation) { google.script.url.getLocation(l => res((l && l.parameter) || {})); return; }
    } catch (e) { /* خارج Apps Script */ }
    const o = {};
    try { new URLSearchParams(location.search).forEach((v, k) => { o[k] = v; }); } catch (e) { /* */ }
    res(o);
  });
}
const CREDIT_HTML = '<div class="app-credit" dir="ltr">Built and developed by Mr. Ibrahim Alluhaydi</div>';
function drvShell(html) {
  let v = $('#driverView');
  if (!v) { v = document.createElement('main'); v.id = 'driverView'; v.className = 'drv'; document.body.appendChild(v); }
  $('#loginView').classList.add('hidden'); $('#appShell').classList.add('hidden');
  v.innerHTML = '<div class="drv-card"><div class="drv-top"><div class="row" style="gap:10px"><span class="brand-logo sm">' + icon('package') + '</span><b>' + esc(t('brand_name')) + '</b></div>' +
    '</div><div class="drv-langs" role="group">' + icon('globe', 'i-sm') + DRV_LANGS.map(l => '<button type="button" class="drv-lang" data-act="drvLang" data-l="' + l[0] + '" lang="' + l[0] + '" aria-pressed="' + (S.lang === l[0]) + '">' + l[1] + '</button>').join('') + '</div>' + html + '</div>' + CREDIT_HTML;
  return v;
}
ACT.drvLang = el => { S.lang = el.dataset.l; store.set('lang', S.lang); applyLang(); if (DRV.render) DRV.render(); };
/* جوال السواق كثيراً على شبكة ضعيفة، والخادم يتأخر أحياناً عند أول طلب:
   نعيد المحاولة تلقائياً قبل إظهار أي خطأ (التسليم آمن للإعادة بفضل clientKey) */
const DRV_RETRY = ['ERR_NETWORK', 'ERR_BAD_RESPONSE', 'ERR_BUSY', 'ERR_TIMEOUT'];
function drvCall(fn, args, n) {
  n = n || 0;
  return call(fn, args).catch(e => {
    if (n >= 4 || DRV_RETRY.indexOf(errCode(e)) === -1) throw e;
    return new Promise(r => setTimeout(r, [1000, 2500, 5000, 8000][n])).then(() => drvCall(fn, args, n + 1));
  });
}
function drvError(e) {
  const bad = errCode(e) === 'ERR_BAD_LINK';
  drvShell(emptyState('alert', bad ? t('drv_bad_link') : errMsg(e)) +
    (bad || !DRV.render ? '' : '<button class="btn btn-primary btn-lg drv-go" data-act="drvRetry">' + icon('refresh') + esc(t('drv_retry')) + '</button>'));
}
ACT.drvRetry = () => { if (DRV.render) DRV.render(); };
function showDriverBox(id, k, back) {
  DRV.render = () => showDriverBox(id, k, back);
  drvShell(skeletonList(1));
  drvCall('boxInfo', { box: id, k: k }).then(b => {
    DRV.photo = ''; DRV.key = uid();
    // لا يمكن التسليم للمكان الموجود فيه البوكس أصلاً
    DRV.to = b.destination && b.destination !== b.location ? b.destination : (b.places.find(p => p !== b.location) || '');
    drvShell((back ? '<button class="btn btn-ghost btn-sm" data-act="drvBack" style="align-self:flex-start">' + icon('chevr', 'i-sm flip') + esc(t('drv_back')) + '</button>' : '') +
      '<div class="drv-head"><span class="drv-box mono">' + esc(b.id) + '</span><h1>' + esc(b.owner) + '</h1>' + branchTag(b.branch) + bxBadge(b.status) +
        '<div class="hint">' + icon('pin', 'i-sm') + ' ' + esc(t('bx_location')) + ': <b>' + esc(placeLabel(b.location)) + '</b> · ' +
        esc(b.loads.length ? t('drv_loads', { n: b.loads.length }) + ' (' + Array.from(new Set(b.loads.map(l => l.request))).join('، ') + ')' : t('drv_empty_box')) + '</div></div>' +
      '<div class="field"><span class="label">' + esc(t('drv_where')) + '</span><div class="drv-places" id="drvPlaces">' +
        b.places.map(p => '<button type="button" class="drv-place" data-act="drvPlace" data-p="' + esc(p) + '" aria-pressed="' + (p === DRV.to) + '"' + (p === b.location ? ' disabled title="' + esc(t('drv_here_now')) + '"' : '') + '>' + icon(p === BOX_HOME ? 'package' : 'building') + '<span>' + esc(placeLabel(p)) + (p === b.location ? '<small>' + esc(t('drv_here_now')) + '</small>' : '') + '</span></button>').join('') + '</div></div>' +
      '<div class="field"><span class="label">' + esc(t('drv_photo')) + '</span><label class="drv-photo" id="drvPhoto">' + icon('image') + '<span>' + esc(t('drv_photo_tap')) + '</span><input type="file" accept="image/*" capture="environment" hidden id="drvFile"></label></div>' +
      '<div class="field"><label for="drvName">' + esc(t('drv_name')) + '</label><input class="input" id="drvName" maxlength="60" autocomplete="name" value="' + esc(store.get('driver_name', '')) + '"></div>' +
      '<div class="field-error hidden" id="drvErr">' + icon('alert', 'i-sm') + '<span></span></div>' +
      '<button class="btn btn-primary btn-lg drv-go" id="drvGo">' + icon('check') + esc(t('drv_deliver')) + '</button>');
    $('#drvFile').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      fileToJpeg(f).then(u => { DRV.photo = u; const ph = $('#drvPhoto'); ph.classList.add('has'); ph.style.backgroundImage = 'url(' + u + ')'; $('#drvErr').classList.add('hidden'); }).catch(er => toast(errMsg(er), 'error'));
    });
    $('#drvGo').addEventListener('click', e => {
      const name = $('#drvName').value.trim(), err = $('#drvErr');
      const fail = msg => { err.querySelector('span').textContent = msg; err.classList.remove('hidden'); };
      if (!DRV.to) return fail(t('ERR_BAD_PLACE'));
      if (!DRV.photo) return fail(t('drv_photo_req'));
      if (!name) return fail(t('ERR_DRIVER_NAME'));
      const btn = e.currentTarget; busy(btn, true, t('sending'));
      drvCall('boxDeliver', { box: id, k: k, to: DRV.to, driver: name, photo: DRV.photo, clientKey: DRV.key }).then(() => {
        store.set('driver_name', name);
        const to = DRV.to;
        DRV.render = null;
        drvShell('<div class="drv-done">' + icon('checkc') + '<h1>' + esc(t('drv_done', { p: placeLabel(to) })) + '</h1><div class="hint">' + esc(b.id + ' · ' + b.owner + ' · ' + fmtDateTime(new Date())) + '</div>' +
          (back ? '<button class="btn btn-lg" data-act="drvBack">' + icon('route', 'i-sm') + esc(t('drv_tasks')) + '</button>' : '') + '</div>');
      }).catch(er => { busy(btn, false); fail(errMsg(er)); });
    });
  }).catch(drvError);
}
ACT.drvPlace = el => { DRV.to = el.dataset.p; $$('#drvPlaces .drv-place').forEach(b => b.setAttribute('aria-pressed', String(b === el))); };
function showDriverTasks(tk) {
  DRV.tk = tk;
  const me = DRV.render = () => showDriverTasks(tk);
  // آخر قائمة ناجحة محفوظة على الجوال: تظهر فوراً، وتبقى ظاهرة إذا تعذّر الاتصال
  const ck = 'drv_tasks:' + tk;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(ck) || 'null'); } catch (e) { /* التخزين غير متاح */ }
  const draw = (list, stale) => drvShell('<div class="between"><h1 style="margin:0">' + icon('route') + ' ' + esc(t('drv_tasks')) + '</h1><button class="btn btn-soft btn-sm" data-act="drvTasks">' + icon('refresh', 'i-sm') + esc(t('drv_refresh')) + '</button></div>' +
      (stale ? '<div class="hint" style="color:var(--warning,#b45309)">' + icon('alert', 'i-sm') + ' ' + esc(t('drv_stale')) + '</div>' : '') +
      (list.length ? '<div class="drv-tasks">' + list.map(x => '<button class="drv-task" data-act="drvOpen" data-id="' + esc(x.id) + '" data-k="' + esc(x.k) + '">' +
        '<div class="between"><span class="drv-box mono">' + esc(x.id) + '</span>' + bxBadge(x.status) + '</div><b>' + esc(x.owner) + '</b>' + branchTag(x.branch) +
        '<span class="drv-route">' + icon('route', 'i-sm') + ' ' + esc(t('drv_from_to', { a: placeLabel(x.location), b: placeLabel(x.destination) })) + '</span>' +
        '<span class="hint">' + (x.count ? esc(t('drv_loads', { n: x.count })) + ' · ' : '') + esc(relTime(x.since)) + '</span></button>').join('') + '</div>'
        : emptyState('checkc', t('drv_no_tasks'))));
  if (cached && Array.isArray(cached.list)) draw(cached.list, false); else drvShell(skeletonList(2));
  drvCall('driverTasks', { k: tk }).then(list => {
    try { localStorage.setItem(ck, JSON.stringify({ list: list, at: Date.now() })); } catch (e) { /* */ }
    if (DRV.render === me) draw(list, false); // ما زال على صفحة المهام نفسها
  }).catch(e => {
    if (DRV.render !== me) return; // السواق فتح بوكساً أثناء التحميل
    if (errCode(e) === 'ERR_BAD_LINK') { try { localStorage.removeItem(ck); } catch (er) { /* */ } return drvError(e); }
    if (cached && Array.isArray(cached.list)) draw(cached.list, true); else drvError(e);
  });
}
ACT.drvOpen = el => showDriverBox(el.dataset.id, el.dataset.k, true);
ACT.drvBack = () => showDriverTasks(DRV.tk);
ACT.drvTasks = () => showDriverTasks(DRV.tk);

/* =====================================================================
   Boot
   ===================================================================== */
(function boot() {
  applyTheme();
  applyLang();
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) { applyTheme(); redrawCharts(); } });
  const done = () => { const b = $('#boot'); b.classList.add('done'); setTimeout(() => b.remove(), 400); };
  // رابط السواق (QR البوكس أو رابط المهام): صفحة مستقلة بدون تسجيل دخول
  getUrlParams().then(p => {
    if (p.box && p.k) { done(); showDriverBox(p.box, p.k, false); return; }
    if (p.driver) { done(); showDriverTasks(p.driver); return; }
    startApp();
  });
  function startApp() {
  // البنغالي والهندي لصفحة السواق فقط — باقي النظام عربي/إنجليزي
  if (S.lang !== 'ar' && S.lang !== 'en') { S.lang = 'en'; applyLang(); }
  const saved = session.get();
  if (saved && saved.token && saved.cfg && saved.cfg.user) {
    // إعادة تحميل الصفحة: نفتح فوراً بآخر بيانات معروفة، ثم نحدّث كل شيء بطلب واحد في الخلفية
    S.token = saved.token;
    restoreRC(saved.cfg.user.name);
    done();
    enterApp(saved.cfg);
    S.cfgAt = 0;
    setTimeout(() => sync(true), 30);
  } else if (saved && saved.token) {
    S.token = saved.token;
    call('getConfig').then(cfg => { done(); session.set({ token: saved.token, cfg: cfg }); enterApp(cfg); }).catch(() => { session.clear(); S.token = null; done(); showLogin(); });
  } else { done(); showLogin(); }
  }
})();
</script>
